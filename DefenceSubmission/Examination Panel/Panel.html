    // =========================================================
    // VIEW 3: SUPERVISION MEETINGS
    // =========================================================
    function filterAndShowMeetings(studentName) {
      switchPortalView('meetings');
      $('meetingFilterStudent').value = studentName;
      filterMeetingLogs(studentName);
    }

    function filterMeetingLogs(studentName) {
      renderMeetingsTable(studentName);
    }

    function renderMeetingsTable(filterStudent) {
      const tbody = $('meetingsTableBody');
      let logs = state.supervisionLogs;

      if (filterStudent) {
        const norm = filterStudent.trim().toLowerCase();
        logs = logs.filter(l => (l.studentName || '').trim().toLowerCase() === norm);
      }

      if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--muted); padding: 24px; font-style: italic;">No consultation records match the filter criteria.</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(l => {
        const statusLower = (l.endorsementStatus || '').toLowerCase();
        const isApproved = statusLower.indexOf('approved') >= 0 || statusLower.indexOf('verified') >= 0;
        const isRevision = statusLower.indexOf('revision') >= 0;
        const statusBadge = isApproved
          ? '<span class="dash-badge verified">Approved</span>'
          : isRevision
          ? '<span class="dash-badge" style="background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;">Revisions</span>'
          : '<span class="dash-badge pending">Pending Approval</span>';

        const actionBtn = isApproved
          ? '<button type="button" class="secondary" style="min-height: 28px; padding: 2px 10px; font-size: 11px;" onclick="openEndorseMeetingModal(\'' + esc(l.logId).replace(/'/g, "\\'") + '\')">View / Edit</button>'
          : '<button type="button" class="primary" style="min-height: 28px; padding: 2px 10px; font-size: 11px;" onclick="openEndorseMeetingModal(\'' + esc(l.logId).replace(/'/g, "\\'") + '\')">Review & Approve</button>';

        return '<tr>' +
          '<td><strong>' + esc(l.meetingDate) + '</strong></td>' +
          '<td><strong>' + esc(l.studentName) + '</strong></td>' +
          '<td>' + esc(l.meetingMode) + '</td>' +
          '<td>' + esc(l.topics) + '</td>' +
          '<td>' + esc(l.actions || '-') + '</td>' +
          '<td>' + esc(l.nextMeetingDate || '-') + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td>' + actionBtn + '</td>' +
        '</tr>';
      }).join('');
    }

    function openLogMeetingModal(preselectedStudent) {
      if (preselectedStudent) {
        $('meetStudentSelect').value = preselectedStudent;
      }
      $('meetDate').value = (new Date()).toISOString().split('T')[0];
      $('meetTopics').value = '';
      $('meetActions').value = '';
      $('meetNextDate').value = '';
      $('meetRemarks').value = '';
      showStatus('logMeetingStatus', '', '');
      $('logMeetingModal').style.display = 'flex';
    }

    function closeLogMeetingModal() {
      $('logMeetingModal').style.display = 'none';
    }

    function handleDirectMeetingSubmit(e) {
      if (e) e.preventDefault();
      const studentName = $('meetStudentSelect').value;
      const meetingDate = $('meetDate').value;
      const meetingMode = $('meetMode').value;
      const topics = $('meetTopics').value.trim();
      const actions = $('meetActions').value.trim();
      const nextMeetingDate = $('meetNextDate').value;
      const remarks = $('meetRemarks').value.trim();

      if (!studentName || !meetingDate || !topics) {
        showStatus('logMeetingStatus', 'Please complete the candidate, date, and topics discussed.', 'error');
        return;
      }

      const btn = $('saveMeetingBtn');
      setBtnLoading(btn, true, 'Recording meeting...');
      showStatus('logMeetingStatus', 'Submitting consultation record...', 'loading');

      const payload = {
        panelName: state.panel.name,
        supervisor: state.panel.name,
        studentName: studentName,
        meetingDate: meetingDate,
        meetingMode: meetingMode,
        topics: topics,
        actions: actions,
        nextMeetingDate: nextMeetingDate,
        remarks: remarks
      };

      google.script.run
        .withSuccessHandler(res => {
          setBtnLoading(btn, false);
          if (!res || !res.ok) {
            showStatus('logMeetingStatus', (res && res.message) || 'Could not record meeting.', 'error');
            return;
          }
          // Prepend locally
          state.supervisionLogs.unshift({
            logId: res.logId,
            timestamp: res.timestamp,
            studentName: studentName,
            supervisor: state.panel.name,
            meetingDate: meetingDate,
            meetingMode: meetingMode,
            topics: topics,
            actions: actions,
            nextMeetingDate: nextMeetingDate,
            recordedBy: 'Supervisor',
            endorsementStatus: 'Verified by Supervisor',
            supervisorRemarks: remarks,
            endorsedAt: res.timestamp
          });

          closeLogMeetingModal();
          renderMeetingsTable($('meetingFilterStudent').value);
          renderDashboard();
          populateSuperviseeViews();
        })
        .withFailureHandler(err => {
          setBtnLoading(btn, false);
          showStatus('logMeetingStatus', (err && err.message) || String(err), 'error');
        })
        .logSupervisorMeetingDirect(facultyPayload(payload));
    }

    function openEndorseMeetingModal(logId) {
      const log = state.supervisionLogs.find(l => l.logId === logId);
      if (!log) return;
      state.targetMeetingLog = log;
      $('endorseStudentName').textContent = log.studentName;
      $('endorseDate').textContent = log.meetingDate;
      $('endorseMode').textContent = log.meetingMode;
      $('endorseTopics').textContent = log.topics;
      $('endorseActions').textContent = log.actions || 'None listed';
      $('endorseRemarks').value = log.supervisorRemarks || '';
      showStatus('endorseMeetingStatus', '', '');
      $('endorseMeetingModal').style.display = 'flex';
    }

    function closeEndorseMeetingModal() {
      $('endorseMeetingModal').style.display = 'none';
      state.targetMeetingLog = null;
    }

    function handleConfirmMeetingEndorsement() {
      if (!state.targetMeetingLog) return;
      const btn = $('confirmEndorseBtn');
      setBtnLoading(btn, true, 'Submitting approval...');
      showStatus('endorseMeetingStatus', 'Saving endorsement...', 'loading');

      const decision = $('endorseDecision') ? $('endorseDecision').value : 'Approved by Supervisor';
      const payload = {
        panelName: state.panel.name,
        logId: state.targetMeetingLog.logId,
        endorsementStatus: decision,
        supervisorRemarks: $('endorseRemarks').value.trim()
      };

      google.script.run
        .withSuccessHandler(res => {
          setBtnLoading(btn, false);
          if (!res || !res.ok) {
            showStatus('endorseMeetingStatus', (res && res.message) || 'Verification failed.', 'error');
            return;
          }
          state.targetMeetingLog.endorsementStatus = res.endorsementStatus;
          state.targetMeetingLog.supervisorRemarks = res.supervisorRemarks;
          state.targetMeetingLog.endorsedAt = res.endorsedAt;

          closeEndorseMeetingModal();
          renderMeetingsTable($('meetingFilterStudent').value);
          renderDashboard();
        })
        .withFailureHandler(err => {
          setBtnLoading(btn, false);
          showStatus('endorseMeetingStatus', (err && err.message) || String(err), 'error');
        })
        .endorseSupervisionLog(facultyPayload(payload));
    }

    // =========================================================
    // VIEW 4: PROGRESS MONITORING REPORTS
    // =========================================================
    function renderProgressTable() {
      const tbody = $('progressTableBody');
      const reports = state.progressReports;

      if (!reports.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--muted); padding: 24px; font-style: italic;">No periodic research progress reports have been submitted by your candidates yet.</td></tr>';
        return;
      }

      tbody.innerHTML = reports.map(r => {
        const isReviewed = (r.status || '').toLowerCase().indexOf('endorsed') >= 0;
        const statusBadge = isReviewed
          ? '<span class="dash-badge verified">' + esc(r.status) + '</span>'
          : '<span class="dash-badge pending">Under Review</span>';

        const ratingBadge = r.supervisorRating
          ? '<span style="font-size: 12px; font-weight: 700; color: var(--purple-800);">' + esc(r.supervisorRating) + '</span>'
          : '<span style="color: var(--muted); font-size: 12px;">Pending</span>';

        const attachBtn = r.attachmentUrl
          ? '<a href="' + esc(r.attachmentUrl) + '" target="_blank" style="color: var(--primary); font-weight: 600; text-decoration: underline;">View PDF</a>'
          : '<span style="color: var(--muted); font-size: 11px;">None</span>';

        return '<tr>' +
          '<td><strong>' + esc(r.period) + '</strong></td>' +
          '<td><strong>' + esc(r.studentName) + '</strong></td>' +
          '<td>' + esc(r.programme || 'Postgraduate') + '</td>' +
          '<td style="max-width: 240px; font-size: 12px;">' + esc(r.milestones) + '</td>' +
          '<td>' + attachBtn + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td>' + ratingBadge + '</td>' +
          '<td>' +
            '<button type="button" class="secondary" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px;" onclick="openEvaluateProgressModal(\'' + esc(r.reportId).replace(/'/g, "\\'") + '\')">' + (isReviewed ? 'Update Review' : 'Evaluate') + '</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function openEvaluateProgressModal(reportId) {
      const rep = state.progressReports.find(r => r.reportId === reportId);
      if (!rep) return;
      state.targetProgressReport = rep;

      $('evalProgCandidate').textContent = rep.studentName + ' (' + (rep.programme || 'Postgraduate') + ')';
      $('evalProgPeriod').textContent = rep.period;
      $('evalProgMilestones').textContent = rep.milestones || '-';
      $('evalProgChallenges').textContent = rep.challenges || 'None reported.';
      $('evalProgPlan').textContent = rep.nextPlan || '-';

      if (rep.attachmentUrl) {
        $('evalProgAttachmentWrap').style.display = 'block';
        $('evalProgAttachmentLink').href = rep.attachmentUrl;
      } else {
        $('evalProgAttachmentWrap').style.display = 'none';
      }

      selectRating(rep.supervisorRating || 'Satisfactory');
      $('evalProgRemarks').value = rep.supervisorRemarks || '';
      showStatus('evaluateProgressStatus', '', '');
      $('evaluateProgressModal').style.display = 'flex';
    }

    function closeEvaluateProgressModal() {
      $('evaluateProgressModal').style.display = 'none';
      state.targetProgressReport = null;
    }

    function selectRating(rating) {
      state.selectedRating = rating;
      ['Satisfactory', 'Minor Concerns', 'Unsatisfactory'].forEach(r => {
        const id = 'rate' + r.replace(/s+/g, '');
        const el = $(id);
        if (el) el.classList.toggle('selected', r === rating);
      });
    }

    function handleSubmitProgressEvaluation() {
      if (!state.targetProgressReport) return;
      const remarks = $('evalProgRemarks').value.trim();
      if (!remarks) {
        showStatus('evaluateProgressStatus', 'Please enter your formal evaluation remarks and recommendations.', 'error');
        return;
      }

      const btn = $('submitEvaluationBtn');
      setBtnLoading(btn, true, 'Submitting endorsement...');
      showStatus('evaluateProgressStatus', 'Recording academic evaluation...', 'loading');

      const payload = {
        panelName: state.panel.name,
        reportId: state.targetProgressReport.reportId,
        rating: state.selectedRating,
        remarks: remarks,
        status: 'Endorsed — ' + state.selectedRating
      };

      google.script.run
        .withSuccessHandler(res => {
          setBtnLoading(btn, false);
          if (!res || !res.ok) {
            showStatus('evaluateProgressStatus', (res && res.message) || 'Failed to submit endorsement.', 'error');
            return;
          }

          state.targetProgressReport.status = res.status;
          state.targetProgressReport.supervisorRating = res.rating;
          state.targetProgressReport.supervisorRemarks = res.remarks;
          state.targetProgressReport.endorsedAt = res.endorsedAt;

          closeEvaluateProgressModal();
          renderProgressTable();
          renderDashboard();
        })
        .withFailureHandler(err => {
          setBtnLoading(btn, false);
          showStatus('evaluateProgressStatus', (err && err.message) || String(err), 'error');
        })
        .evaluateProgressReport(facultyPayload(payload));
    }

    // =========================================================
    // VIEW 5: EXAMINER REPORT SUBMISSION HUB (CARD VIEW & WORKSPACE)
    // =========================================================
    let hubSearchQuery = '';
    let hubActiveFilter = 'all';

    function populateCaseSelector() {
      // 1. Maintain hidden select for backward compatibility
      const select = $('caseSelectDropdown');
      if (select) {
        select.innerHTML = '<option value="">-- Choose an assigned candidate --</option>' + 
          state.cases.map(c => {
            let tag;
            if (c.isChairOnly) {
              const bothSub = Boolean(c.examiner1Submitted && c.examiner2Submitted);
              tag = bothSub ? ' ⚖ [Chair Review · Both Reports Submitted]' : ' ⚖ [Chairperson Review Hub]';
            } else if (c.isSupervisorOnly) {
              tag = ' 🎓 [Supervisee · Defence Assessment]';
            } else {
              const isSubmitted = Boolean(c.reportSubmitted || isStatusSubmitted(c.reportStatus, c.reportFileUrl));
              tag = isSubmitted ? ' ✓ [Report Submitted]' : ' [Pending Report]';
            }
            return '<option value="' + esc(c.caseId) + '">' + 
              esc(c.studentName) + ' — ' + esc(c.defenceType) + ' (' + esc(c.caseId) + ' · ' + esc(c.slot) + ')' + tag +
            '</option>';
          }).join('');
      }

      // 2. Render cards list
      renderSubmissionCards();
    }

    function setHubFilter(filter) {
      hubActiveFilter = filter;
      document.querySelectorAll('.hub-filter-pill').forEach(btn => {
        if (btn.getAttribute('data-filter') === filter) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderSubmissionCards();
    }

    function handleHubSearch(val) {
      hubSearchQuery = (val || '').trim().toLowerCase();
      renderSubmissionCards();
    }

    function renderSubmissionCards() {
      const container = $('submissionCardsContainer');
      if (!container) return;

      const cases = state.cases || [];

      // Update counters
      let countAll = cases.length;
      let countPending = 0;
      let countSubmitted = 0;

      cases.forEach(c => {
        const isSubmitted = Boolean(c.reportSubmitted || isStatusSubmitted(c.reportStatus, c.reportFileUrl) || (c.isChairOnly && (c.isSessionCompleted || (c.examiner1Submitted && c.examiner2Submitted))));
        if (isSubmitted) countSubmitted++;
        else countPending++;
      });

      if ($('hubCountAll')) $('hubCountAll').textContent = countAll;
      if ($('hubCountPending')) $('hubCountPending').textContent = countPending;
      if ($('hubCountSubmitted')) $('hubCountSubmitted').textContent = countSubmitted;

      // Filter cases
      let filtered = cases.filter(c => {
        const isSubmitted = Boolean(c.reportSubmitted || isStatusSubmitted(c.reportStatus, c.reportFileUrl) || (c.isChairOnly && (c.isSessionCompleted || (c.examiner1Submitted && c.examiner2Submitted))));
        if (hubActiveFilter === 'pending' && isSubmitted) return false;
        if (hubActiveFilter === 'submitted' && !isSubmitted) return false;

        if (hubSearchQuery) {
          const haystack = [
            c.studentName,
            c.caseId,
            c.programme,
            c.defenceType,
            c.researchTitle,
            c.supervisor,
            c.chairperson,
            c.examiner1Name,
            c.examiner2Name
          ].join(' ').toLowerCase();
          if (haystack.indexOf(hubSearchQuery) === -1) return false;
        }
        return true;
      });

      if (!cases.length) {
        container.innerHTML = '<div style="padding: 32px 20px; text-align: center; color: var(--muted); background: #f8fafc; border: 1px dashed var(--line); border-radius: var(--radius-md); font-style: italic;">No candidate evaluation cases are currently assigned to your faculty profile.</div>';
        return;
      }

      if (!filtered.length) {
        container.innerHTML = '<div style="padding: 28px 20px; text-align: center; color: var(--muted); background: #f8fafc; border: 1px dashed var(--line); border-radius: var(--radius-md); font-size: 13px;">No candidates match your search filter "' + esc(hubSearchQuery || hubActiveFilter) + '". <button type="button" class="secondary" style="margin-left: 8px; min-height: 28px; padding: 2px 10px; font-size: 12px;" onclick="resetHubFilter()">Reset Filters</button></div>';
        return;
      }

      container.innerHTML = filtered.map(c => {
        const isSelected = state.selectedCase && state.selectedCase.caseId === c.caseId;
        const isSubmitted = Boolean(c.reportSubmitted || isStatusSubmitted(c.reportStatus, c.reportFileUrl));
        const stageBadge = (c.defenceType && c.defenceType.toLowerCase().indexOf('viva') >= 0)
          ? '<span class="dash-badge viva">Viva Voce</span>'
          : '<span class="dash-badge proposal">Proposal Defence</span>';

        let roleBadge;
        if (c.isSupervisorOnly) {
          roleBadge = '<span class="dash-badge" style="background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;">Supervisor</span>';
        } else if (c.isChairOnly) {
          roleBadge = '<span class="dash-badge" style="background:#ffedd5;color:#9a3412;border:1px solid #fed7aa;">Chairperson</span>';
        } else {
          roleBadge = '<span class="dash-badge" style="background:#f3e8ff;color:#6b21a8;border:1px solid #e9d5ff;">' + esc(c.slot || 'Examiner') + '</span>';
        }

        let statusBadge;
        if (c.isSupervisorOnly) {
          statusBadge = '<span class="dash-badge" style="background:#f1f5f9;color:#475569;">Candidature Active</span>';
        } else if (c.isChairOnly) {
          if (c.isSessionCompleted) {
            const shortScale = c.resultScale ? c.resultScale.split(':')[0].trim() : 'Completed';
            statusBadge = '<span class="dash-badge" style="background:#dcfce7;color:#15803d;font-weight:700;">✓ ' + esc(shortScale) + '</span>';
          } else {
            const bothSub = Boolean(c.examiner1Submitted && c.examiner2Submitted);
            if (bothSub) {
              statusBadge = '<span class="dash-badge submitted">Ready for Deliberation</span>';
            } else if (c.examiner1Submitted || c.examiner2Submitted) {
              statusBadge = '<span class="dash-badge pending">Partial Reports (1 of 2)</span>';
            } else {
              statusBadge = '<span class="dash-badge" style="background:#f1f5f9;color:#475569;">Awaiting Examiner Reports</span>';
            }
          }
        } else {
          statusBadge = isSubmitted
            ? '<span class="dash-badge submitted">✓ Report Submitted</span>'
            : '<span class="dash-badge pending">⏳ Pending Report</span>';
        }

        const timeFormatted = formatDisplayTime(c.startTime, c.endTime);
        const dateStr = c.sessionDate 
          ? (esc(c.sessionDate) + (timeFormatted ? ' · ' + esc(timeFormatted) : ''))
          : 'Schedule pending';

        return '<div class="submission-card' + (isSelected ? ' selected' : '') + '" id="card-case-' + esc(c.caseId) + '">' +
          // Minimal summary side
          '<div class="sub-card-main">' +
            '<div class="sub-card-header-row">' +
              '<h3 class="sub-card-student-name">' + esc(c.studentName) + '</h3>' +
              stageBadge +
              roleBadge +
              statusBadge +
            '</div>' +
            '<div class="sub-card-meta-line">' +
              '<span class="sub-card-meta-item">' +
                '<strong>Case ID:</strong> ' + esc(c.caseId) +
              '</span>' +
              '<span>·</span>' +
              '<span class="sub-card-meta-item">' +
                '<strong>Programme:</strong> ' + esc(c.programme || 'Postgraduate Degree') +
              '</span>' +
              '<span>·</span>' +
              '<span class="sub-card-meta-item">' +
                '<svg class="ui-icon" style="width:13px;height:13px;color:var(--muted);" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>' +
                '<span>' + dateStr + '</span>' +
              '</span>' +
            '</div>' +
          '</div>' +

          // Action button just to enter the student workspace
          '<div class="sub-card-action-side">' +
            '<button type="button" class="' + (isSelected ? 'secondary' : 'primary') + '" style="font-size: 13px; min-height: 36px; padding: 6px 16px; display: inline-flex; align-items: center; gap: 7px;" onclick="handleCaseSelect(\'' + esc(c.caseId).replace(/'/g, "\\'") + '\')">' +
              '<svg class="ui-icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>' +
              '<span>' + (isSelected ? 'Workspace Active ▾' : 'Enter Candidate Workspace →') + '</span>' +
            '</button>' +
          '</div>' +

        '</div>';
      }).join('');
    }

    function resetHubFilter() {
      hubSearchQuery = '';
      hubActiveFilter = 'all';
      if ($('hubSearchInput')) $('hubSearchInput').value = '';
      setHubFilter('all');
    }

    function closeCaseSelection() {
      state.selectedCase = null;
      if ($('caseSelectDropdown')) $('caseSelectDropdown').value = '';
      if ($('studentDossier')) $('studentDossier').style.display = 'none';
      if ($('hubListViewContainer')) $('hubListViewContainer').style.display = 'block';
      if ($('submissionReceiptCard')) $('submissionReceiptCard').style.display = 'none';
      renderSubmissionCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function downloadWordTemplateForCase(caseId) {
      const c = state.cases.find(x => x.caseId === caseId);
      if (!c || !state.panel) return;
      showStatus('submissionNotice', 'Generating prefilled Word report form (.docx) for ' + c.studentName + '...', 'loading');

      google.script.run
        .withSuccessHandler(result => {
          try {
            const binary = atob(result.base64Data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: result.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = result.fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showStatus('submissionNotice', 'Prefilled Word report form for ' + c.studentName + ' downloaded successfully.', 'success');
          } catch (e) {
            showStatus('submissionNotice', 'Error handling downloaded template: ' + e.message, 'error');
          }
        })
        .withFailureHandler(error => {
          if (!handleSessionExpiry(error, 'submissionNotice')) {
            showStatus('submissionNotice', (error && error.message) || String(error) || 'Could not download template.', 'error');
          }
        })
        .getExaminerReportTemplate(state.panel.name, caseId, state.sessionToken);
    }

    function selectCaseAndGoSubmission(caseId) {
      switchPortalView('submission');
      if ($('caseSelectDropdown')) $('caseSelectDropdown').value = caseId;
      handleCaseSelect(caseId);
    }

    function handleCaseSelect(caseId) {
      showStatus('submissionNotice', '', '');
      showStatus('templateDownloadStatus', '', '');
      showStatus('uploadStatusNotice', '', '');
      if ($('submissionReceiptCard')) $('submissionReceiptCard').style.display = 'none';

      if (!caseId) {
        closeCaseSelection();
        return;
      }

      const found = state.cases.find(c => c.caseId === caseId);
      if (!found) {
        showStatus('submissionNotice', 'Selected case could not be found.', 'error');
        return;
      }

      state.selectedCase = found;
      if ($('caseSelectDropdown')) $('caseSelectDropdown').value = caseId;

      // HIDE candidate list view entirely, SHOW candidate workspace page
      if ($('hubListViewContainer')) $('hubListViewContainer').style.display = 'none';
      if ($('studentDossier')) $('studentDossier').style.display = 'block';

      // Workspace page header
      if ($('hubWorkspaceTitle')) {
        $('hubWorkspaceTitle').textContent = found.studentName;
      }
      if ($('hubWorkspaceSub')) {
        $('hubWorkspaceSub').textContent = 'Case Ref: ' + found.caseId + ' · ' + (found.programme || 'Postgraduate Degree');
      }

      // Top badges in workspace header
      if ($('hubWorkspaceTopBadges')) {
        const stageBadge = (found.defenceType && found.defenceType.toLowerCase().indexOf('viva') >= 0)
          ? '<span class="dash-badge viva">Viva Voce</span>'
          : '<span class="dash-badge proposal">Proposal Defence</span>';

        let roleBadge;
        if (found.isSupervisorOnly) {
          roleBadge = '<span class="dash-badge" style="background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;">Supervisor</span>';
        } else if (found.isChairOnly) {
          roleBadge = '<span class="dash-badge" style="background:#ffedd5;color:#9a3412;border:1px solid #fed7aa;">Chairperson</span>';
        } else {
          roleBadge = '<span class="dash-badge" style="background:#f3e8ff;color:#6b21a8;border:1px solid #e9d5ff;">' + esc(found.slot || 'Examiner') + '</span>';
        }

        $('hubWorkspaceTopBadges').innerHTML = stageBadge + roleBadge;
      }

      $('dosStudentName').textContent = found.studentName;
      $('dosCaseId').textContent = found.caseId;
      $('dosProgramme').textContent = found.programme || 'Postgraduate Degree';
      $('dosDefenceType').textContent = found.defenceType;
      $('dosPanelSlot').textContent = found.slot + ' (' + found.role + ')';
      const timeFormatted = formatDisplayTime(found.startTime, found.endTime);
      $('dosSessionTime').textContent = (found.sessionDate || 'To be scheduled') + (timeFormatted ? ' · ' + timeFormatted : '');
      $('dosVenue').textContent = found.venue || (found.googleMeetLink ? 'Online (Google Meet)' : 'Campus Venue');
      $('dosReportStatus').textContent = found.reportStatus;
      $('dosResearchTitle').textContent = found.researchTitle || 'Title pending institutional confirmation.';

      // Populate Supervisory & Examination Panels Info
      if ($('dosSupervisorName')) $('dosSupervisorName').textContent = found.supervisor || 'Not Assigned';
      if ($('dosSupervisorEmail')) $('dosSupervisorEmail').textContent = found.supervisorEmail || (found.supervisor ? 'Contact via Academic Directory' : 'No contact on record');

      if ($('dosChairpersonName')) $('dosChairpersonName').textContent = found.chairperson || 'Not Appointed';
      if ($('dosChairpersonEmail')) $('dosChairpersonEmail').textContent = found.chairpersonEmail || (found.chairperson ? 'Contact via Academic Directory' : 'No contact on record');

      if ($('dosEx1Name')) $('dosEx1Name').textContent = found.examiner1Name || 'Not Appointed';
      if ($('dosEx1RoleLabel')) $('dosEx1RoleLabel').textContent = found.examiner1Role || 'Examiner 1';
      if ($('dosEx1Email')) $('dosEx1Email').textContent = found.examiner1Email || (found.examiner1Name ? 'Contact via Academic Directory' : 'No contact on record');
      if ($('dosEx1ReportStatusBadge')) {
        if (found.examiner1Submitted) {
          $('dosEx1ReportStatusBadge').textContent = '✓ Submitted';
          $('dosEx1ReportStatusBadge').style.background = '#dcfce7';
          $('dosEx1ReportStatusBadge').style.color = '#15803d';
        } else if (found.examiner1Name) {
          $('dosEx1ReportStatusBadge').textContent = '⏳ Pending';
          $('dosEx1ReportStatusBadge').style.background = '#fef3c7';
          $('dosEx1ReportStatusBadge').style.color = '#92400e';
        } else {
          $('dosEx1ReportStatusBadge').textContent = 'Unassigned';
          $('dosEx1ReportStatusBadge').style.background = '#f1f5f9';
          $('dosEx1ReportStatusBadge').style.color = '#64748b';
        }
      }

      if ($('dosEx2Name')) $('dosEx2Name').textContent = found.examiner2Name || 'Not Appointed';
      if ($('dosEx2RoleLabel')) $('dosEx2RoleLabel').textContent = found.examiner2Role || 'Examiner 2';
      if ($('dosEx2Email')) $('dosEx2Email').textContent = found.examiner2Email || (found.examiner2Name ? 'Contact via Academic Directory' : 'No contact on record');
      if ($('dosEx2ReportStatusBadge')) {
        if (found.examiner2Submitted) {
          $('dosEx2ReportStatusBadge').textContent = '✓ Submitted';
          $('dosEx2ReportStatusBadge').style.background = '#dcfce7';
          $('dosEx2ReportStatusBadge').style.color = '#15803d';
        } else if (found.examiner2Name) {
          $('dosEx2ReportStatusBadge').textContent = '⏳ Pending';
          $('dosEx2ReportStatusBadge').style.background = '#fef3c7';
          $('dosEx2ReportStatusBadge').style.color = '#92400e';
        } else {
          $('dosEx2ReportStatusBadge').textContent = 'Unassigned';
          $('dosEx2ReportStatusBadge').style.background = '#f1f5f9';
          $('dosEx2ReportStatusBadge').style.color = '#64748b';
        }
      }

      if (found.studentDraftLink) {
        if ($('dosDraftWrapper')) $('dosDraftWrapper').style.display = 'block';
        if ($('dosDraftLink')) $('dosDraftLink').href = found.studentDraftLink;
      } else {
        if ($('dosDraftWrapper')) $('dosDraftWrapper').style.display = 'none';
      }

      if (found.googleMeetLink) {
        if ($('dosMeetWrapper')) $('dosMeetWrapper').style.display = 'block';
        if ($('dosMeetLink')) $('dosMeetLink').href = found.googleMeetLink;
      } else {
        if ($('dosMeetWrapper')) $('dosMeetWrapper').style.display = 'none';
      }

      if (!found.hasFolder) {
        showStatus('submissionNotice', 'Notice: The candidate\'s Google Drive folder has not yet been initialized. Please contact the Secretariat.', 'error');
      }

      if (found.isSupervisorOnly) {
        if ($('examinerSubmissionArea')) $('examinerSubmissionArea').style.display = 'none';
        if ($('chairpersonReviewArea')) $('chairpersonReviewArea').style.display = 'none';
        if ($('supervisorDossierNoticeArea')) $('supervisorDossierNoticeArea').style.display = 'block';
      } else if (found.isChairOnly || (found.isChair && !found.isExaminer)) {
        // Appointed Chairperson Mode (Exclusively for appointed Chairperson)
        if ($('supervisorDossierNoticeArea')) $('supervisorDossierNoticeArea').style.display = 'none';
        if ($('examinerSubmissionArea')) $('examinerSubmissionArea').style.display = 'none';
        if ($('chairpersonReviewArea')) $('chairpersonReviewArea').style.display = 'block';

        // Examiner 1 details
        if ($('chairEx1Name')) $('chairEx1Name').textContent = found.examiner1Name || 'Not Appointed';
        if ($('chairEx1Role')) $('chairEx1Role').textContent = found.examiner1Role || 'Examiner 1';
        if ($('chairEx1StatusBadge')) {
          if (found.examiner1Submitted) {
            $('chairEx1StatusBadge').textContent = '✓ Submitted';
            $('chairEx1StatusBadge').style.background = '#dcfce7';
            $('chairEx1StatusBadge').style.color = '#15803d';
          } else {
            $('chairEx1StatusBadge').textContent = '⏳ Pending Submission';
            $('chairEx1StatusBadge').style.background = '#fef3c7';
            $('chairEx1StatusBadge').style.color = '#92400e';
          }
        }
        if (found.examiner1ReportLink) {
          if ($('chairEx1DocLink')) $('chairEx1DocLink').href = found.examiner1ReportLink;
          if ($('chairEx1DocWrap')) $('chairEx1DocWrap').style.display = 'block';
          if ($('chairEx1PendingNotice')) $('chairEx1PendingNotice').style.display = 'none';
        } else {
          if ($('chairEx1DocWrap')) $('chairEx1DocWrap').style.display = 'none';
          if ($('chairEx1PendingNotice')) $('chairEx1PendingNotice').style.display = 'flex';
        }

        // Examiner 2 details
        if ($('chairEx2Name')) $('chairEx2Name').textContent = found.examiner2Name || 'Not Appointed';
        if ($('chairEx2Role')) $('chairEx2Role').textContent = found.examiner2Role || 'Examiner 2';
        if ($('chairEx2StatusBadge')) {
          if (found.examiner2Submitted) {
            $('chairEx2StatusBadge').textContent = '✓ Submitted';
            $('chairEx2StatusBadge').style.background = '#dcfce7';
            $('chairEx2StatusBadge').style.color = '#15803d';
          } else {
            $('chairEx2StatusBadge').textContent = '⏳ Pending Submission';
            $('chairEx2StatusBadge').style.background = '#fef3c7';
            $('chairEx2StatusBadge').style.color = '#92400e';
          }
        }
        if (found.examiner2ReportLink) {
          if ($('chairEx2DocLink')) $('chairEx2DocLink').href = found.examiner2ReportLink;
          if ($('chairEx2DocWrap')) $('chairEx2DocWrap').style.display = 'block';
          if ($('chairEx2PendingNotice')) $('chairEx2PendingNotice').style.display = 'none';
        } else {
          if ($('chairEx2DocWrap')) $('chairEx2DocWrap').style.display = 'none';
          if ($('chairEx2PendingNotice')) $('chairEx2PendingNotice').style.display = 'flex';
        }

        // Candidate Draft Link Button
        if ($('chairDraftLinkBtn')) {
          if (found.studentDraftLink) {
            $('chairDraftLinkBtn').href = found.studentDraftLink;
            $('chairDraftLinkBtn').style.pointerEvents = 'auto';
            $('chairDraftLinkBtn').style.opacity = '1';
          } else {
            $('chairDraftLinkBtn').href = '#';
            $('chairDraftLinkBtn').style.pointerEvents = 'none';
            $('chairDraftLinkBtn').style.opacity = '0.5';
          }
        }

        // Readiness Banner and Summary Badge
        const ex1Done = Boolean(found.examiner1Submitted);
        const ex2Done = Boolean(found.examiner2Submitted);
        if ($('chairSubmissionSummaryBadge')) {
          if (ex1Done && ex2Done) {
            $('chairSubmissionSummaryBadge').textContent = 'Ready for Deliberation';
            $('chairSubmissionSummaryBadge').style.background = '#dcfce7';
            $('chairSubmissionSummaryBadge').style.color = '#15803d';
          } else if (ex1Done || ex2Done) {
            $('chairSubmissionSummaryBadge').textContent = 'Partially Submitted (1 of 2)';
            $('chairSubmissionSummaryBadge').style.background = '#fef3c7';
            $('chairSubmissionSummaryBadge').style.color = '#92400e';
          } else {
            $('chairSubmissionSummaryBadge').textContent = 'Awaiting Examiner Reports';
            $('chairSubmissionSummaryBadge').style.background = '#f1f5f9';
            $('chairSubmissionSummaryBadge').style.color = '#475569';
          }
        }

        if ($('chairReadinessBanner') && $('chairReadinessText')) {
          if (ex1Done && ex2Done) {
            $('chairReadinessBanner').style.background = '#f0fdf4';
            $('chairReadinessBanner').style.borderColor = '#86efac';
            $('chairReadinessText').innerHTML = '<strong style="color:#15803d;">Both Examiner Reports Available:</strong> The examination board has received evaluation reports from both Examiner 1 and Examiner 2. You may review both reports ahead of the defence session.';
          } else if (ex1Done || ex2Done) {
            const who = ex1Done ? 'Examiner 1 has submitted; awaiting Examiner 2.' : 'Examiner 2 has submitted; awaiting Examiner 1.';
            $('chairReadinessBanner').style.background = '#fffbeb';
            $('chairReadinessBanner').style.borderColor = '#fde68a';
            $('chairReadinessText').innerHTML = '<strong style="color:#92400e;">Partial Submission:</strong> ' + who;
          } else {
            $('chairReadinessBanner').style.background = '#f8fafc';
            $('chairReadinessBanner').style.borderColor = '#e2e8f0';
            $('chairReadinessText').innerHTML = '<strong style="color:#475569;">Awaiting Reports:</strong> Neither examiner has submitted an evaluation report yet. You will be able to review their reports here once submitted.';
          }

        // Initialize and populate Chairperson Deliberation & Outcome section
        populateChairDeliberation(found);

        if ($('supervisorDossierNoticeArea')) $('supervisorDossierNoticeArea').style.display = 'none';
        if ($('examinerSubmissionArea')) $('examinerSubmissionArea').style.display = 'block';
        if ($('chairpersonReviewArea')) $('chairpersonReviewArea').style.display = 'none';

        const isSubmitted = Boolean(found.reportSubmitted || isStatusSubmitted(found.reportStatus, found.reportFileUrl));
        if (isSubmitted) {
          if ($('reportUploadActiveArea')) $('reportUploadActiveArea').style.display = 'none';
          if ($('reportSubmittedLockedCard')) $('reportSubmittedLockedCard').style.display = 'block';
          if ($('lockedReportCandidate')) $('lockedReportCandidate').textContent = found.studentName + ' (' + found.caseId + ')';
          if ($('lockedReportRole')) $('lockedReportRole').textContent = found.slot + (found.role ? ' · ' + found.role : '');
          if ($('lockedReportTimestamp')) $('lockedReportTimestamp').textContent = found.reportUpdatedAt || 'Recorded in Registry';
          if (found.reportFileUrl) {
            if ($('submittedReportLink')) $('submittedReportLink').href = found.reportFileUrl;
            if ($('submittedReportLinkWrap')) $('submittedReportLinkWrap').style.display = 'block';
          } else {
            if ($('submittedReportLinkWrap')) $('submittedReportLinkWrap').style.display = 'none';
          }
          if ($('reportFileInput')) $('reportFileInput').disabled = true;
          if ($('declarationCheckbox')) {
            $('declarationCheckbox').checked = false;
            $('declarationCheckbox').disabled = true;
          }
          if ($('submitReportBtn')) $('submitReportBtn').disabled = true;
        } else {
          if ($('reportUploadActiveArea')) $('reportUploadActiveArea').style.display = 'block';
          if ($('reportSubmittedLockedCard')) $('reportSubmittedLockedCard').style.display = 'none';
          if ($('reportFileInput')) $('reportFileInput').disabled = false;

    // CHAIRPERSON DELIBERATION & SESSION COMPLETION HANDLERS

    function parseDefenceDate(dateStr) {
      if (!dateStr) return null;
      if (dateStr instanceof Date) return isNaN(dateStr) ? null : dateStr;
      const str = String(dateStr).trim();
      const parts = str.split(/[-/]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          // YYYY-MM-DD
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          const dt = new Date(y, m, d);
          return isNaN(dt) ? null : dt;
        } else if (parts[2].length === 4) {
          // DD-MM-YYYY
          const d = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const y = parseInt(parts[2], 10);
          const dt = new Date(y, m, d);
          return isNaN(dt) ? null : dt;
        }
      }
      const parsed = new Date(str);
      return isNaN(parsed) ? null : parsed;
    }

    function addMonthsToDate(date, months) {
      if (!date) return null;
      const res = new Date(date.getTime());
      res.setMonth(res.getMonth() + months);
      return res;
    }

    function formatIsoDate(date) {
      if (!date || isNaN(date)) return '';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatReadableDate(date) {
      if (!date || isNaN(date)) return '';
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function selectSubmissionPeriod(key) {
      const radioMap = {
        '3_months': $('periodRadio3'),
        '6_months': $('periodRadio6'),
        '12_months': $('periodRadio12'),
        'none': $('periodRadioNone')
      };
      if (radioMap[key]) {
        radioMap[key].checked = true;
      }
      updatePeriodSelection();
    }

    function updatePeriodSelection() {
      const selectedRadio = document.querySelector('input[name="chairPeriodOption"]:checked');
      const periodCards = {
        '3_months': $('periodCard3'),
        '6_months': $('periodCard6'),
        '12_months': $('periodCard12'),
        'none': $('periodCardNone')
      };

      Object.values(periodCards).forEach(card => {
        if (card) card.classList.remove('selected-period');
      });

      if (!selectedRadio) {
        if ($('chairComputedDeadlineText')) $('chairComputedDeadlineText').textContent = 'Select a recommendation or timeline above';
        state.selectedSubmissionDeadline = '';
        return;
      }

      const selectedKey = selectedRadio.value;
      if (periodCards[selectedKey]) {
        periodCards[selectedKey].classList.add('selected-period');
      }

      const defDate = parseDefenceDate(state.selectedCase ? state.selectedCase.sessionDate : null) || new Date();

      if (selectedKey === 'none') {
        state.selectedSubmissionDeadline = 'No Corrections Required';
        if ($('chairComputedDeadlineText')) $('chairComputedDeadlineText').textContent = 'No Corrections Required (Scale 1 / Scale 5)';
        if ($('chairCustomDeadlinePicker')) $('chairCustomDeadlinePicker').value = '';
      } else {
        const months = selectedKey === '3_months' ? 3 : (selectedKey === '6_months' ? 6 : 12);
        const targetDate = addMonthsToDate(defDate, months);
        const iso = formatIsoDate(targetDate);
        const readable = formatReadableDate(targetDate);
        state.selectedSubmissionDeadline = iso;
        if ($('chairComputedDeadlineText')) $('chairComputedDeadlineText').textContent = readable + ' (' + months + ' Months from Defence)';
        if ($('chairCustomDeadlinePicker')) $('chairCustomDeadlinePicker').value = iso;
      }
    }

    function handleCustomDeadlineDateChange() {
      const picker = $('chairCustomDeadlinePicker');
      const customVal = picker ? picker.value : '';
      if (!customVal) return;

      // Deselect period radios
      const radios = document.querySelectorAll('input[name="chairPeriodOption"]');
      radios.forEach(r => { r.checked = false; });
      const cards = document.querySelectorAll('.period-card');
      cards.forEach(c => c.classList.remove('selected-period'));

      const dt = parseDefenceDate(customVal);
      state.selectedSubmissionDeadline = customVal;
      if ($('chairComputedDeadlineText')) {
        $('chairComputedDeadlineText').textContent = dt ? (formatReadableDate(dt) + ' (Custom Date)') : customVal;
      }
    }

        const pRadios = document.querySelectorAll('input[name="chairPeriodOption"]');

        pCards.forEach(c => c.classList.remove('selected-period'));
        if ($('chairCustomDeadlinePicker')) $('chairCustomDeadlinePicker').value = '';

    function handleChairProofSelected(file) {
      if (!file) return;
      const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
      if (!validTypes.includes(file.type) && !/\.(jpe?g|png|webp|pdf)$/i.test(file.name)) {
        showStatus('chairCompletionNotice', 'Please select a valid image (JPG, PNG, WEBP) or PDF file.', 'error');
        clearChairProofFile();
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        showStatus('chairCompletionNotice', 'The selected proof file exceeds the 8 MB size limit.', 'error');
        clearChairProofFile();
        return;
      }

      showStatus('chairCompletionNotice', '', '');

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const base64 = dataUrl.split(',')[1];
        state.chairProofData = {
          name: file.name,
          mimeType: file.type || 'image/jpeg',
          base64: base64,
          sizeStr: (file.size / 1024).toFixed(1) + ' KB'
        };

        if ($('chairProofFileName')) $('chairProofFileName').textContent = file.name;
        if ($('chairProofFileSize')) $('chairProofFileSize').textContent = state.chairProofData.sizeStr;

        if ($('chairProofThumb')) {
          if (file.type && file.type.startsWith('image/')) {
            $('chairProofThumb').src = dataUrl;
            $('chairProofThumb').style.display = 'block';
          } else {
            $('chairProofThumb').style.display = 'none';
          }
        }

        if ($('chairProofPreviewWrap')) $('chairProofPreviewWrap').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function handleMarkSessionCompleted() {
      if (!state.selectedCase || !state.panel) {
        showStatus('chairCompletionNotice', 'No active session or faculty user identified.', 'error');
        return;
      }

      const selectedRadio = document.querySelector('input[name="chairScaleOption"]:checked');
      if (!selectedRadio) {
        showStatus('chairCompletionNotice', 'Please select an official recommendation scale (Scale 1 to Scale 5) before completing the session.', 'error');
        return;
      }

      const resultScale = selectedRadio.value;
      const deadlineVal = state.selectedSubmissionDeadline || ($('chairCustomDeadlinePicker') ? $('chairCustomDeadlinePicker').value.trim() : '');
      const remarks = $('chairDeliberationRemarks') ? $('chairDeliberationRemarks').value.trim() : '';

      const confirmMsg = 'Are you sure you want to mark this defence session as COMPLETED with the following recommendation:\n\n' +
        '• Recommendation: ' + resultScale + '\n' +
        (deadlineVal ? ('• Submission Deadline: ' + deadlineVal + '\n') : '') + '\n' +
        'This will officially record the deliberation outcome and alert administration to dispatch official results to the candidate.';
      if (!confirm(confirmMsg)) return;

      const btn = $('btnMarkSessionCompleted');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:6px;animation:spin 0.8s linear infinite;"></span><span>Saving Deliberation Outcome...</span>';
      }

      showStatus('chairCompletionNotice', 'Finalising deliberation outcome and uploading session proof...', 'loading');

      const payload = {
        panelName: state.panel.name,
        caseId: state.selectedCase.caseId,
        resultScale: resultScale,
        correctionsDeadline: deadlineVal,
        notes: remarks,
        proofBase64: state.chairProofData ? state.chairProofData.base64 : '',
        proofFileName: state.chairProofData ? state.chairProofData.name : '',
        proofMimeType: state.chairProofData ? state.chairProofData.mimeType : ''
      };

      google.script.run
        .withSuccessHandler(function(response) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<svg class="ui-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Mark Defence Session as Completed</span>';
          }

          if (!response || !response.success) {
            showStatus('chairCompletionNotice', 'Unable to record completion: ' + (response && response.error ? response.error : 'Unknown error'), 'error');
            return;
          }

          // Update state
          state.selectedCase.isSessionCompleted = true;
          state.selectedCase.sessionStatus = 'Completed';
          state.selectedCase.resultScale = response.resultScale;
          state.selectedCase.resultStatus = 'Decided';
          state.selectedCase.correctionsDeadline = response.correctionsDeadline || deadlineVal;
          state.selectedCase.finalSubmissionDue = response.correctionsDeadline || deadlineVal;
          state.selectedCase.sessionProofLink = response.sessionProofLink || '';
          state.selectedCase.notes = remarks;

          // Update cases array
          const idx = state.cases.findIndex(c => c.caseId === state.selectedCase.caseId);
          if (idx >= 0) {
            state.cases[idx].isSessionCompleted = true;
            state.cases[idx].sessionStatus = 'Completed';
            state.cases[idx].resultScale = response.resultScale;
            state.cases[idx].resultStatus = 'Decided';
            state.cases[idx].correctionsDeadline = response.correctionsDeadline || deadlineVal;
            state.cases[idx].finalSubmissionDue = response.correctionsDeadline || deadlineVal;
            state.cases[idx].sessionProofLink = response.sessionProofLink || '';
            state.cases[idx].notes = remarks;
          }

          // Update calendar events
          const calIdx = state.calendarEvents.findIndex(ev => ev.caseId === state.selectedCase.caseId);
          if (calIdx >= 0) {
            state.calendarEvents[calIdx].isSessionCompleted = true;
            state.calendarEvents[calIdx].sessionStatus = 'Completed';
            state.calendarEvents[calIdx].resultScale = response.resultScale;
            state.calendarEvents[calIdx].resultStatus = response.resultStatus || 'Decided';
            state.calendarEvents[calIdx].correctionsDeadline = response.correctionsDeadline || deadlineVal;
          }

          showStatus('chairCompletionNotice', '', '');

          // Refresh candidate workspace chair section
          populateChairDeliberation(state.selectedCase);

          // Re-render report hub cards so the list view also reflects completion
          renderReportHub();

          const recMsg = response.resultScale + (response.resultStatus && response.resultStatus !== 'Decided' ? (' – ' + response.resultStatus) : '');
          alert('✓ Defence Session successfully marked as Completed!\n\nRecommendation: ' + recMsg + '\nSubmission Deadline: ' + (response.correctionsDeadline || deadlineVal || 'N/A') + '\n\nSession outcome has been recorded in the central examination registry.');
        })
        .withFailureHandler(function(err) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<svg class="ui-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Mark Defence Session as Completed</span>';
          }
          showStatus('chairCompletionNotice', 'Failed to complete session: ' + (err.message || err), 'error');
        })
        .completeDefenceSession(facultyPayload(payload));
    }

    function handleDownloadWordTemplate() {
      if (!state.selectedCase || !state.panel) return;
      const btn = $('downloadWordBtn');
      setBtnLoading(btn, true, 'Generating Word document...');
      showStatus('templateDownloadStatus', 'Generating prefilled Word report form (.docx)...', 'loading');

      google.script.run
        .withSuccessHandler(result => {
          setBtnLoading(btn, false);
          try {
            const binary = atob(result.base64Data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: result.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = result.fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showStatus('templateDownloadStatus', 'Prefilled Word report form downloaded successfully.', 'success');
          } catch (e) {
            showStatus('templateDownloadStatus', 'Error handling downloaded template: ' + e.message, 'error');
          }
        })
        .withFailureHandler(error => {
          setBtnLoading(btn, false);
          if (!handleSessionExpiry(error, 'templateDownloadStatus')) {
            showStatus('templateDownloadStatus', (error && error.message) || String(error) || 'Could not download template.', 'error');
          }
        })
        .getExaminerReportTemplate(state.panel.name, state.selectedCase.caseId, state.sessionToken);
    }

    function setupDropzone() {
      const dropzone = $('reportDropZone');
      if (!dropzone) return;

      ['dragenter', 'dragover'].forEach(ev => {
        dropzone.addEventListener(ev, e => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(ev => {
        dropzone.addEventListener(ev, e => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });

      dropzone.addEventListener('drop', e => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          handleFileSelected(e.dataTransfer.files[0]);
        }
      });
    }

    function handleFileSelected(file) {
      if (!file) return;
      const maxBytes = 8 * 1024 * 1024;
      const allowed = ['pdf', 'doc', 'docx'];
      const ext = file.name.split('.').pop().toLowerCase();

      if (!allowed.includes(ext)) {
        showStatus('uploadStatusNotice', 'Only PDF, DOC, and DOCX documents are accepted.', 'error');
        return;
      }
      if (file.size > maxBytes) {
        showStatus('uploadStatusNotice', 'Selected file (' + (file.size / 1024 / 1024).toFixed(1) + ' MB) exceeds the 8 MB limit.', 'error');
        return;
      }

      showStatus('uploadStatusNotice', '', '');
      state.selectedFile = file;
      $('selectedFileName').textContent = file.name + ' (' + formatFileSize(file.size) + ')';
      $('selectedFileWrap').style.display = 'block';
      updateConfirmState();
    }

    function clearSelectedFile() {
      state.selectedFile = null;
      if ($('reportFileInput')) $('reportFileInput').value = '';
      if ($('selectedFileWrap')) $('selectedFileWrap').style.display = 'none';
      updateConfirmState();
    }

    function updateConfirmState() {
      if (!state.selectedCase) {
        if ($('submitReportBtn')) $('submitReportBtn').disabled = true;
        return;
      }
      const isSubmitted = Boolean(state.selectedCase.reportSubmitted || isStatusSubmitted(state.selectedCase.reportStatus, state.selectedCase.reportFileUrl));
      if (isSubmitted) {
        if ($('submitReportBtn')) $('submitReportBtn').disabled = true;
        return;
      }
      const isConfirmed = $('declarationCheckbox') && $('declarationCheckbox').checked;
      const hasFile = !!state.selectedFile;
      const hasCase = !!state.selectedCase;
      if ($('submitReportBtn')) $('submitReportBtn').disabled = !(isConfirmed && hasFile && hasCase);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function mimeFor(file) {
      if (file.type) return file.type;
      const ext = file.name.toLowerCase().split('.').pop();
      if (ext === 'pdf') return 'application/pdf';
      if (ext === 'doc') return 'application/msword';
      if (ext === 'docx') return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      return 'application/octet-stream';
    }

    function toBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunk = 32768;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
      }
      return btoa(binary);
    }

    function handleSubmitReport() {
      if (!state.selectedCase || !state.selectedFile || !state.panel) return;
      const btn = $('submitReportBtn');
      setBtnLoading(btn, true, 'Uploading report to candidate folder...');
      showStatus('uploadStatusNotice', 'Encoding and transferring report to institutional Drive repository...', 'loading');

      const reader = new FileReader();
      reader.onerror = () => {
        setBtnLoading(btn, false);
        showStatus('uploadStatusNotice', 'Failed to read file from local storage.', 'error');
      };

      reader.onload = () => {
        const payload = {
          panelName: state.panel.name,
          caseId: state.selectedCase.caseId,
          fileName: state.selectedFile.name,
          mimeType: mimeFor(state.selectedFile),
          base64Data: toBase64(reader.result)
        };

        google.script.run
          .withSuccessHandler(result => {
            setBtnLoading(btn, false);
            showStatus('uploadStatusNotice', '', '');
            
            state.selectedCase.reportStatus = 'Submitted';
            state.selectedCase.reportSubmitted = true;
            state.selectedCase.reportFileUrl = result.fileUrl || '';
            state.selectedCase.reportUpdatedAt = result.submittedAt || '';
            const item = state.cases.find(c => c.caseId === result.caseId);
            if (item) {
              item.reportStatus = 'Submitted';
              item.reportSubmitted = true;
              item.reportFileUrl = result.fileUrl || '';
              item.reportUpdatedAt = result.submittedAt || '';
            }
            const calEv = state.calendarEvents.find(c => c.caseId === result.caseId);
            if (calEv) {
              calEv.reportStatus = 'Submitted';
              calEv.reportSubmitted = true;
              calEv.reportFileUrl = result.fileUrl || '';
              calEv.reportUpdatedAt = result.submittedAt || '';
            }

            populateCaseSelector();
            $('caseSelectDropdown').value = result.caseId;

            $('studentDossier').style.display = 'none';
            const receiptDetails = $('receiptDetails');
            receiptDetails.innerHTML = 
              '<div><strong>Candidate:</strong> ' + esc(result.studentName) + '</div>' +
              '<div><strong>Case Reference:</strong> ' + esc(result.caseId) + '</div>' +
              '<div><strong>Examiner Appointment:</strong> ' + esc(result.slot) + ' (' + esc(result.panelName) + ')</div>' +
              '<div><strong>Archived Filename:</strong> ' + esc(result.savedName) + '</div>' +
              '<div><strong>Submission Timestamp:</strong> ' + esc(result.submittedAt) + '</div>' +
              '<div><strong>Repository Destination:</strong> Candidate Google Drive Folder</div>';
            
            $('submissionReceiptCard').style.display = 'block';
            renderDashboard();
          })
          .withFailureHandler(error => {
            setBtnLoading(btn, false);
            const msg = (error && error.message) || String(error) || 'Failed to submit report.';
            showStatus('uploadStatusNotice', msg, 'error');
          })
          .uploadExaminerReport(facultyPayload(payload));
      };

      reader.readAsArrayBuffer(state.selectedFile);
    }

    function resetSubmissionForm() {
      $('submissionReceiptCard').style.display = 'none';
      if ($('caseSelectDropdown')) $('caseSelectDropdown').value = '';
      state.selectedCase = null;
      clearSelectedFile();
      if ($('declarationCheckbox')) $('declarationCheckbox').checked = false;
      if ($('studentDossier')) $('studentDossier').style.display = 'none';
      if ($('hubListViewContainer')) $('hubListViewContainer').style.display = 'block';
      renderSubmissionCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================
    // VIEW 6: EXAMINATION CALENDAR
    // =========================================================
    function setCalendarMode(mode) {
      state.calendarMode = mode;
      $('btnViewGrid').classList.toggle('active', mode === 'grid');
      $('btnViewAgenda').classList.toggle('active', mode === 'agenda');
      $('calendarMonthGridWrap').style.display = mode === 'grid' ? 'block' : 'none';
      $('calendarAgendaWrap').style.display = mode === 'agenda' ? 'flex' : 'none';
      renderCalendar();
    }

    function setCalendarFilter(filter) {
      state.calendarFilter = filter;
      ['all', 'proposal', 'viva'].forEach(f => {
        const btn = $('filter' + capitalize(f));
        if (btn) btn.classList.toggle('active', f === filter);
      });
      renderCalendar();
    }

    function changeMonth(delta) {
      state.calendarDate.setMonth(state.calendarDate.getMonth() + delta);
      renderCalendar();
    }

    function goToCurrentMonth() {
      state.calendarDate = new Date();
      renderCalendar();
    }

    function renderCalendar() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      $('calendarMonthTitle').textContent = monthNames[month] + ' ' + year;

      let events = state.calendarEvents;
      if (state.calendarFilter === 'proposal') {
        events = events.filter(e => e.type === 'proposal');
      } else if (state.calendarFilter === 'viva') {
        events = events.filter(e => e.type === 'viva');
      }

      if (state.calendarMode === 'grid') {
        renderMonthGrid(year, month, events);
      } else {
        renderAgendaView(events);
      }
    }

    function renderMonthGrid(year, month, events) {
      const grid = $('calendarDayGrid');
      grid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      const today = new Date();
      const isThisMonth = today.getFullYear() === year && today.getMonth() === month;
      const todayDate = today.getDate();

      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const dayNum = prevMonthDays - i;
        const cell = document.createElement('div');
        cell.className = 'calendar-day-cell other-month';
        cell.innerHTML = '<div class="day-num-wrap"><span class="day-num">' + dayNum + '</span></div>';
        grid.appendChild(cell);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        const isToday = isThisMonth && d === todayDate;
        cell.className = 'calendar-day-cell' + (isToday ? ' today' : '');

        const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const dayEvents = events.filter(e => e.date === dateStr);

        let eventsHtml = '';
        dayEvents.forEach(ev => {
          const typeClass = ev.type === 'viva' ? 'viva' : 'proposal';
          const timeLabel = formatDisplayTime(ev.startTime) || 'Scheduled';
          eventsHtml += 
            '<div class="event-chip ' + typeClass + '" onclick="openSessionModal(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')" title="' + esc(ev.studentName) + ' (' + esc(ev.defenceType) + ')">' +
              '<span class="event-chip-time">' + esc(timeLabel) + '</span>' +
              '<span class="event-chip-title">' + esc(ev.studentName) + '</span>' +
            '</div>';
        });

        cell.innerHTML = '<div class="day-num-wrap"><span class="day-num">' + d + '</span></div>' + eventsHtml;
        grid.appendChild(cell);
      }

      const totalCells = firstDayIndex + daysInMonth;
      const trailingDays = (7 - (totalCells % 7)) % 7;
      for (let d = 1; d <= trailingDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day-cell other-month';
        cell.innerHTML = '<div class="day-num-wrap"><span class="day-num">' + d + '</span></div>';
        grid.appendChild(cell);
      }
    }

    function renderAgendaView(events) {
      const wrap = $('calendarAgendaWrap');
      if (!events.length) {
        wrap.innerHTML = '<div style="background:#fff; padding:24px; text-align:center; color:var(--muted); border-radius:10px; border:1px solid var(--line); font-style:italic;">No examination sessions found matching your filter criteria.</div>';
        return;
      }

      const monthAbbrs = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

      wrap.innerHTML = events.map(ev => {
        const parts = ev.date.split('-');
        const monthNum = parseInt(parts[1], 10) - 1;
        const monthStr = monthAbbrs[monthNum] || 'DEF';
        const dayStr = parts[2] || '01';

        const typeBadge = ev.type === 'viva'
          ? '<span class="dash-badge viva">Viva Voce</span>'
          : '<span class="dash-badge proposal">Proposal Defence</span>';

        const meetBtn = ev.googleMeetLink
          ? '<a href="' + esc(ev.googleMeetLink) + '" target="_blank" class="btn secondary" style="min-height:30px; padding:3px 10px; font-size:12px;">' +
              '<svg class="ui-icon" style="width:13px;height:13px;" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>' +
              '<span>Meet</span>' +
            '</a>'
          : '';

        let subBtnHtml;
        if (ev.isSupervisorOnly) {
          subBtnHtml = '<button type="button" class="secondary" style="min-height:30px; padding:3px 12px; font-size:12px; background:#eef2ff; color:#4338ca; border-color:#c7d2fe;" onclick="selectCaseAndGoSubmission(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">View Supervisee</button>';
        } else if (ev.isChairOnly) {
          subBtnHtml = '<button type="button" style="min-height:30px; padding:3px 12px; font-size:12px; background:#6b21a8; color:#fff;" onclick="selectCaseAndGoSubmission(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Review Reports</button>';
        } else {
          const isSubmitted = Boolean(ev.reportSubmitted || isStatusSubmitted(ev.reportStatus, ev.reportFileUrl));
          subBtnHtml = isSubmitted
            ? '<button type="button" class="secondary" style="min-height:30px; padding:3px 12px; font-size:12px; opacity:0.8;" disabled title="Report already submitted">✓ Report Submitted</button>'
            : '<button type="button" style="min-height:30px; padding:3px 12px; font-size:12px;" onclick="selectCaseAndGoSubmission(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Submit Report</button>';
        }

        const timeFormatted = formatDisplayTime(ev.startTime, ev.endTime) || 'TBD';

        return '<div class="agenda-card">' +
          '<div class="agenda-date-box">' +
            '<span class="agenda-date-month">' + monthStr + '</span>' +
            '<span class="agenda-date-day">' + dayStr + '</span>' +
            '<span class="agenda-date-time">' + esc(timeFormatted) + '</span>' +
          '</div>' +
          '<div class="agenda-content">' +
            '<div class="agenda-top-row">' +
              '<div>' +
                '<span class="agenda-candidate-name">' + esc(ev.studentName) + '</span>' +
                '<span style="font-size:12px; color:var(--muted); margin-left:8px;">(' + esc(ev.caseId) + ')</span>' +
              '</div>' +
              typeBadge +
            '</div>' +
            '<div style="font-size:13px; color:var(--ink-secondary); font-weight:500;">' +
              'Research: ' + esc(ev.researchTitle || 'Postgraduate Candidate Assessment') +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:8px; margin-top:8px;">' +
              '<button type="button" class="secondary" style="min-height:30px; padding:3px 12px; font-size:12px;" onclick="openSessionModal(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Full Dossier</button>' +
              subBtnHtml +
              meetBtn +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function openSessionModal(caseId) {
      const found = state.cases.find(c => c.caseId === caseId) || state.calendarEvents.find(c => c.caseId === caseId);
      if (!found) return;

      state.modalCase = found;
      $('modalStudentName').textContent = found.studentName;
      $('modalName').textContent = found.studentName;
      $('modalCaseId').textContent = found.caseId;
      const timeFormatted = formatDisplayTime(found.startTime, found.endTime);
      $('modalDateTime').textContent = (found.sessionDate || found.date || 'TBD') + (timeFormatted ? ' (' + timeFormatted + ')' : '');
      $('modalVenue').textContent = found.venue || (found.googleMeetLink ? 'Online (Google Meet)' : 'Campus Venue');
      $('modalRole').textContent = found.slot + (found.role ? ' · ' + found.role : '');
      $('modalReportStatus').textContent = found.reportStatus;
      $('modalTitle').textContent = found.researchTitle || 'Title pending institutional confirmation.';

      // Populate Supervisory & Examination Panels Info in Modal
      if ($('modalSupervisorName')) $('modalSupervisorName').textContent = found.supervisor || 'Not Assigned';
      if ($('modalSupervisorEmail')) $('modalSupervisorEmail').textContent = found.supervisorEmail || (found.supervisor ? 'Contact via Academic Directory' : 'No contact on record');

      if ($('modalChairpersonName')) $('modalChairpersonName').textContent = found.chairperson || 'Not Appointed';
      if ($('modalChairpersonEmail')) $('modalChairpersonEmail').textContent = found.chairpersonEmail || (found.chairperson ? 'Contact via Academic Directory' : 'No contact on record');

      if ($('modalEx1Name')) $('modalEx1Name').textContent = found.examiner1Name || 'Not Appointed';
      if ($('modalEx1RoleLabel')) $('modalEx1RoleLabel').textContent = found.examiner1Role || 'Examiner 1';
      if ($('modalEx1Email')) $('modalEx1Email').textContent = found.examiner1Email || (found.examiner1Name ? 'Contact via Academic Directory' : 'No contact on record');
      if ($('modalEx1Badge')) {
        if (found.examiner1Submitted) {
          $('modalEx1Badge').textContent = '✓ Submitted';
          $('modalEx1Badge').style.background = '#dcfce7';
          $('modalEx1Badge').style.color = '#15803d';
        } else if (found.examiner1Name) {
          $('modalEx1Badge').textContent = '⏳ Pending';
          $('modalEx1Badge').style.background = '#fef3c7';
          $('modalEx1Badge').style.color = '#92400e';
        } else {
          $('modalEx1Badge').textContent = 'Unassigned';
          $('modalEx1Badge').style.background = '#f1f5f9';
          $('modalEx1Badge').style.color = '#64748b';
        }
      }

      if ($('modalEx2Name')) $('modalEx2Name').textContent = found.examiner2Name || 'Not Appointed';
      if ($('modalEx2RoleLabel')) $('modalEx2RoleLabel').textContent = found.examiner2Role || 'Examiner 2';
      if ($('modalEx2Email')) $('modalEx2Email').textContent = found.examiner2Email || (found.examiner2Name ? 'Contact via Academic Directory' : 'No contact on record');
      if ($('modalEx2Badge')) {
        if (found.examiner2Submitted) {
          $('modalEx2Badge').textContent = '✓ Submitted';
          $('modalEx2Badge').style.background = '#dcfce7';
          $('modalEx2Badge').style.color = '#15803d';
        } else if (found.examiner2Name) {
          $('modalEx2Badge').textContent = '⏳ Pending';
          $('modalEx2Badge').style.background = '#fef3c7';
          $('modalEx2Badge').style.color = '#92400e';
        } else {
          $('modalEx2Badge').textContent = 'Unassigned';
          $('modalEx2Badge').style.background = '#f1f5f9';
          $('modalEx2Badge').style.color = '#64748b';
        }
      }

      const isViva = (found.defenceType || found.type || '').toLowerCase().indexOf('viva') >= 0;
      $('modalTypeBadge').textContent = isViva ? 'Viva Voce' : 'Proposal Defence';
      $('modalTypeBadge').className = 'dash-badge ' + (isViva ? 'viva' : 'proposal');

      const modalBtn = $('modalGoSubmissionBtn');
      if (modalBtn) {
        if (found.isSupervisorOnly) {
          modalBtn.querySelector('span').textContent = 'View Supervisee Dossier';
          modalBtn.disabled = false;
          modalBtn.style.opacity = '1';
          modalBtn.style.cursor = 'pointer';
          modalBtn.style.background = '#4338ca';
          modalBtn.style.color = '#fff';
        } else if (found.isChairOnly) {
          modalBtn.querySelector('span').textContent = 'Review Examiner Reports';
          modalBtn.disabled = false;
          modalBtn.style.opacity = '1';
          modalBtn.style.cursor = 'pointer';
          modalBtn.style.background = '#6b21a8';
          modalBtn.style.color = '#fff';
        } else {
          modalBtn.style.background = '';
          modalBtn.style.color = '';
          const isSub = Boolean(found.reportSubmitted || isStatusSubmitted(found.reportStatus, found.reportFileUrl));
          if (isSub) {
            modalBtn.querySelector('span').textContent = 'Report Already Submitted';
            modalBtn.disabled = true;
            modalBtn.style.opacity = '0.6';
            modalBtn.style.cursor = 'not-allowed';
          } else {
            modalBtn.querySelector('span').textContent = 'Submit Examiner Report';
            modalBtn.disabled = false;
            modalBtn.style.opacity = '1';
            modalBtn.style.cursor = 'pointer';
          }
        }
      }

      if (found.googleMeetLink) {
        $('modalMeetWrap').style.display = 'block';
        $('modalMeetLink').href = found.googleMeetLink;
      } else {
        $('modalMeetWrap').style.display = 'none';
      }

      $('sessionModalOverlay').style.display = 'flex';
    }

    function closeSessionModal() {
      $('sessionModalOverlay').style.display = 'none';
      state.modalCase = null;
    }

    function handleModalBackdropClick(e, modalId) {
      if (e.target === $(modalId)) {
        if (modalId === 'sessionModalOverlay') closeSessionModal();
        if (modalId === 'logMeetingModal') closeLogMeetingModal();
        if (modalId === 'endorseMeetingModal') closeEndorseMeetingModal();
        if (modalId === 'evaluateProgressModal') closeEvaluateProgressModal();
      }
    }

    function handleModalGoSubmission() {
      if (!state.modalCase) return;
      const id = state.modalCase.caseId;
      closeSessionModal();
      selectCaseAndGoSubmission(id);
    }
  </script>

try{state.sessionToken=sessionStorage.getItem('panel_session')||'';}catch(e){}

  const screen=document.getElementById('loginScreen');
  form=document.createElement('form');form.id='facultyCodeForm';form.style.cssText='max-width:420px;padding:24px;background:var(--surface,#fff);border:1px solid var(--line,#ddd);border-radius:12px;margin:15px auto;';
  form.innerHTML='<label for="facultyCode">Verification code sent to your registered email</label><input id="facultyCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required style="width:100%;padding:12px;margin:12px 0;font:inherit"><button type="submit">Verify and sign in</button><p role="alert"></p>';
  screen.append(form);form.querySelector('input').focus();
  form.onsubmit=e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;google.script.run.withSuccessHandler(r=>{state.sessionToken=r.sessionToken;try{sessionStorage.setItem('panel_session',r.sessionToken);}catch(e){}form.remove();executeLogin(name,email,false);}).withFailureHandler(err=>{b.disabled=false;form.querySelector('[role=alert]').textContent=err.message||String(err);}).verifyFacultyAccessCode(challengeId,form.querySelector('input').value);};

<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Management System — Supervisory Panel</title>
  <style>
    :root {
      /* Design Tokens: Mature Academic Enterprise */
      --primary: #4c1d95;
      --primary-hover: #3b1675;
      --primary-dark: #2e1065;
      --primary-light: #6d28d9;
      --primary-soft: #f3eefa;
      --purple-deep: #2e1065;
      --purple-dark: #3b1675;
      --purple-950: #1e1b4b;
      --purple-900: #2e1065;
      --purple-800: #4c1d95;
      --purple-700: #581c87;
      --purple-600: #6d28d9;
      --purple-500: #7c3aed;
      --purple-300: #c4b5fd;
      --purple-200: #ddd6fe;
      --purple-100: #ede9fe;
      --purple-50: #f5f3ff;
      --purple-soft: #f3eefa;

      /* Amber / Warm Gold */
      --amber-800: #92400e;
      --amber-700: #b45309;
      --amber-600: #d97706;
      --amber-500: #f59e0b;
      --amber-200: #fde68a;
      --amber-100: #fef3c7;
      --amber-50: #fffbeb;

      /* Emerald & Mint (Pass / Submitted / Verified) */
      --emerald-800: #166534;
      --emerald-700: #15803d;
      --emerald-600: #16a34a;
      --emerald-200: #bbf7d0;
      --emerald-100: #dcfce7;
      --emerald-50: #f0fdf4;

      /* Teal (Viva & Sessions) */
      --teal-800: #115e59;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-200: #99f6e4;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;

      /* Rose & Coral (Alerts / Deadlines) */
      --rose-800: #991b1b;
      --rose-700: #b91c1c;
      --rose-600: #dc2626;
      --rose-200: #fecaca;
      --rose-100: #fee2e2;
      --rose-50: #fef2f2;

      /* Surfaces & Inks */
      --ink: #1e293b;
      --ink-secondary: #475569;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --line: #e2e8f0;
      --line-subtle: #f1f5f9;
      --surface: #ffffff;
      --soft: #f6f7fb;
      --bg: #f6f7fb;

      /* Semantic Statuses */
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-line: #fecaca;
      --success: #166534;
      --success-bg: #dcfce7;
      --success-line: #bbf7d0;
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --warning-line: #fde68a;
      --info: #1e40af;
      --info-bg: #dbeafe;
      --info-line: #bfdbfe;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Standardized Buttons */
    button, .btn {
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      min-height: 38px;
      padding: 8px 16px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
      box-shadow: var(--shadow-xs);
    }
    button:hover:not(:disabled), .btn:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: none;
      box-shadow: var(--shadow-sm);
    }
    button:disabled, .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.secondary, .btn.secondary {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
    }
    button.secondary:hover:not(:disabled), .btn.secondary:hover:not(:disabled) {
      background: var(--purple-50);
      border-color: var(--purple-200);
      color: var(--primary);
    }
    button.teal, .btn.teal {
      background: var(--teal-700);
      border-color: var(--teal-700);
      color: #fff;
    }
    button.teal:hover:not(:disabled), .btn.teal:hover:not(:disabled) {
      background: var(--teal-800);
      border-color: var(--teal-800);
    }
    button.success, .btn.success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    button.success:hover:not(:disabled), .btn.success:hover:not(:disabled) {
      background: var(--emerald-700);
      border-color: var(--emerald-700);
    }

    input, select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:hover, select:hover, textarea:hover { border-color: #94a3b8; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(88, 28, 135, .10);
    }
    textarea { min-height: 84px; resize: vertical; }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    label .required { color: var(--danger); }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

    /* SVG Vector Icon System */
    .ui-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .iuc-logo {
      display: flex; align-items: center; justify-content: center;
      width: 154px; min-width: 154px; height: 44px; padding: 2px 4px;
      border: none;
      background: transparent;
    }
    .iuc-logo img { display: block; width: auto; height: 100%; max-height: 42px; object-fit: contain; }

    /* Notice Banner */
    .notice {
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 13px;
      font-weight: 500;
    }
    .notice.loading { background: #f8fafc; color: var(--ink); border: 1px solid var(--line); }
    .notice.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-line); }
    .notice.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-line); }
    .notice.info { background: var(--purple-50); color: var(--purple-950); border: 1px solid var(--purple-200); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .spinner.dark {
      border-color: rgba(88,28,135,.2);
      border-top-color: var(--primary);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 1. LOGIN SCREEN */
    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px 48px;
      background: var(--soft);
    }
    .login-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 6px 28px rgba(88, 28, 135, 0.08);
      overflow: hidden;
    }
    .login-card-head {
      padding: 28px 24px 22px;
      background: linear-gradient(135deg, #2e1065 0%, #4c1d95 60%, #581c87 100%);
      color: #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .login-card-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .login-card-head p {
      margin: 0;
      color: var(--purple-200);
      font-size: 12px;
      line-height: 1.4;
    }
    .login-card-body {
      padding: 28px 30px 32px;
    }
    .autocomplete-wrap {
      position: relative;
    }
    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      list-style: none;
      margin: 0;
      padding: 4px 0;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
    }
    .suggestion-item {
      padding: 9px 14px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      transition: background-color .15s ease;
    }
    .suggestion-item:hover, .suggestion-item.active {
      background: var(--purple-50);
      color: var(--purple-900);
      font-weight: 600;
    }

    /* 2. POST-LOGIN APP SHELL */
    .app-screen {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .app-header {
      width: 100%;
      background: var(--purple-deep);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #ffffff;
      box-sizing: border-box;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.15);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .app-header-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .app-header-brand .iuc-logo {
      width: 132px;
      min-width: 132px;
      height: 38px;
    }
    .app-header-brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
    }
    .app-header-brand p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--purple-200);
    }
    .app-header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-pill {
      padding: 4px 10px;
      border: 1px solid rgba(253, 230, 138, 0.35);
      border-radius: var(--radius-sm);
      background: rgba(253, 230, 138, 0.12);
      color: #fde68a;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .app-body {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 20px 60px;
      box-sizing: border-box;
      flex: 1;
    }

    /* Sidebar */
    .portal-sidebar {
      width: 270px;
      min-width: 270px;
      position: sticky;
      top: 76px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }
    .sidebar-profile-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-xs);
    }
    .sidebar-profile-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .sidebar-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: var(--shadow-xs);
    }
    .sidebar-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      word-break: break-word;
    }
    .sidebar-meta-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      border-top: 1px solid var(--line-subtle);
      padding-top: 10px;
    }
    .sidebar-meta-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }
    .sidebar-meta-row strong {
      color: var(--ink);
      font-weight: 600;
    }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--purple-50);
      color: var(--primary);
      border: 1px solid var(--purple-200);
      font-size: 11px;
      font-weight: 600;
    }

    .sidebar-nav {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-xs);
    }
    .nav-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 12px 4px;
    }
    .sidebar-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all .15s ease;
      box-shadow: none;
      min-height: auto;
      min-width: auto;
    }
    .sidebar-nav-btn:hover {
      background: var(--purple-50);
      color: var(--primary);
    }
    .sidebar-nav-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-xs);
    }
    .sidebar-nav-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--purple-700);
      flex-shrink: 0;
    }
    .sidebar-nav-btn.active .sidebar-nav-icon {
      color: #ffffff;
    }

    .sidebar-info-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .sidebar-info-card h4 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* Main Panel */
    .portal-main-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .portal-view {
      display: none;
      animation: fadeIn .2s ease;
    }
    .portal-view.active {
      display: block;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-head {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line-subtle);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-head-title h2 {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
    }
    .card-head-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .card-body {
      padding: 24px;
    }

    /* Banners & Metrics */
    .welcome-banner {
      background: #ffffff;
      border: 1px solid var(--purple-200);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .welcome-text h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: var(--purple-950);
    }
    .welcome-text p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .metric-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .metric-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.1;
    }
    .metric-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .metric-card.highlight {
      border-color: var(--purple-300);
      background: var(--purple-50);
    }
    .metric-card.highlight .metric-value {
      color: var(--purple-800);
    }
    .metric-card.warning-box {
      border-color: var(--amber-200);
      background: var(--amber-50);
    }
    .metric-card.warning-box .metric-value {
      color: var(--amber-700);
    }

    .dash-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 980px) {
      .dash-columns { grid-template-columns: 1fr; }
    }

    .dash-item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dash-item-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .15s ease;
    }
    .dash-item-card:hover {
      border-color: var(--purple-300);
    }
    .dash-item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .dash-item-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .dash-item-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .dash-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .dash-badge.proposal {
      background: var(--purple-100);
      color: var(--purple-800);
      border: 1px solid var(--purple-200);
    }
    .dash-badge.viva {
      background: var(--teal-100);
      color: var(--teal-800);
      border: 1px solid var(--teal-200);
    }
    .dash-badge.pending {
      background: var(--amber-100);
      color: var(--amber-800);
      border: 1px solid var(--amber-200);
    }
    .dash-badge.submitted {
      background: var(--emerald-100);
      color: var(--emerald-800);
      border: 1px solid var(--emerald-200);
    }
    .dash-badge.verified {
      background: var(--emerald-100);
      color: var(--emerald-800);
      border: 1px solid var(--emerald-200);
    }

    /* Supervisee Cards Grid */
    .supervisee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .supervisee-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform .15s ease, border-color .15s ease;
    }
    .supervisee-card:hover {
      transform: translateY(-2px);
      border-color: var(--purple-300);
      box-shadow: var(--shadow-md);
    }
    .supervisee-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .supervisee-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .supervisee-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .supervisee-title-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--ink-secondary);
      font-weight: 500;
      line-height: 1.45;
    }
    .supervisee-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--purple-50);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--purple-950);
      font-weight: 600;
    }
    .supervisee-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    /* Tables */
    .table-responsive {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: #fff;
    }
    .portal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    .portal-table th {
      padding: 11px 14px;
      background: var(--soft);
      color: var(--muted);
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .portal-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-subtle);
      color: var(--ink);
      vertical-align: top;
    }
    .portal-table tr:last-child td {
      border-bottom: none;
    }
    .portal-table tr:hover td {
      background: var(--soft);
    }

    /* Dossier & Template Box */
    .dossier-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
      margin-bottom: 20px;
    }
    .dossier-grid .wide { grid-column: 1 / -1; }
    .dossier-item .label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .dossier-item .value {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .research-title-box {
      background: var(--purple-50);
      border: 1px solid var(--purple-200);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--purple-950);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    .template-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      margin: 20px 0;
      background: var(--purple-50);
      border: 1px solid var(--purple-200);
      border-radius: var(--radius-md);
    }
    .template-box h4 {
      margin: 0 0 4px;
      color: var(--purple-950);
      font-size: 15px;
      font-weight: 700;
    }
    .template-box p {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .dropzone {
      margin-top: 18px;
      border: 2px dashed #9fb3c8;
      border-radius: var(--radius-md);
      padding: 26px 20px;
      text-align: center;
      background: #f8fafc;
      transition: border-color .2s, background-color .2s;
      cursor: pointer;
    }
    .dropzone.dragover {
      border-color: var(--primary);
      background: var(--purple-50);
    }
    .dropzone-icon {
      width: 36px;
      height: 36px;
      color: var(--purple-700);
      margin: 0 auto 10px;
    }
    .dropzone-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 4px;
    }
    .dropzone-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }
    .selected-file-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 8px 14px;
      background: var(--purple-100);
      color: var(--purple-900);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .remove-file-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      padding: 0;
      min-height: auto;
      box-shadow: none;
    }

    .declaration-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
      padding: 14px 16px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
    }
    .declaration-check input {
      width: 18px;
      min-height: 18px;
      margin-top: 2px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .receipt-card {
      background: #ffffff;
      border: 1px solid var(--success-line);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .receipt-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--success-bg);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .receipt-grid {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin: 20px auto;
      max-width: 580px;
      text-align: left;
      font-size: 13px;
      line-height: 1.7;
    }

    /* Submission Hub Card List & Search Styles */
    .hub-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .hub-search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .hub-search-box input {
      width: 100%;
      padding-left: 36px;
      font-size: 13px;
      min-height: 38px;
    }
    .hub-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .hub-filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hub-filter-pill {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: none;
      min-height: 32px;
    }
    .hub-filter-pill:hover {
      background: var(--soft);
      border-color: var(--line-focus);
    }
    .hub-filter-pill.active {
      background: var(--purple-800);
      color: #ffffff;
      border-color: var(--purple-800);
    }

    .submission-cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .submission-card {
      background: #ffffff;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      transition: all .15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .submission-card:hover {
      border-color: var(--purple-300);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .submission-card.selected {
      border-color: var(--purple-700);
      background: #faf8ff;
      box-shadow: 0 0 0 2px rgba(88, 28, 135, 0.15), var(--shadow-sm);
    }

    .sub-card-main {
      flex: 1;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sub-card-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sub-card-student-name {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink);
    }
    .sub-card-meta-line {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sub-card-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sub-card-action-side {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .active-workspace-banner {
      background: linear-gradient(135deg, var(--purple-100) 0%, #ede9fe 100%);
      border: 1.5px solid var(--purple-300);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .active-workspace-info h4 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 700;
      color: var(--purple-950);
    }
    .active-workspace-info p {
      margin: 0;
      font-size: 12px;
      color: var(--purple-800);
    }

    /* Calendar Controls */
    .calendar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .calendar-nav-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .calendar-month-heading {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      min-width: 170px;
      text-align: center;
    }
    .calendar-filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 12px;
      font-size: 12px;
      min-height: 32px;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink-secondary);
      border: 1px solid var(--line);
      cursor: pointer;
      box-shadow: none;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Month Grid */
    .calendar-table-wrap {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-collapse: collapse;
      width: 100%;
    }
    .calendar-weekday {
      background: var(--soft);
      padding: 10px 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--line);
    }
    .calendar-day-cell {
      min-height: 110px;
      border-right: 1px solid var(--line-subtle);
      border-bottom: 1px solid var(--line-subtle);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #ffffff;
      transition: background-color .15s ease;
    }
    .calendar-day-cell:nth-child(7n) { border-right: none; }
    .calendar-day-cell.other-month { background: #fbfbfd; opacity: 0.45; }
    .calendar-day-cell.today { background: #fcfaff; }
    .day-num-wrap { display: flex; justify-content: flex-end; margin-bottom: 2px; }
    .day-num {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      border-radius: 50%;
    }
    .calendar-day-cell.today .day-num {
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
    }
    .event-chip {
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.25;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 1px;
      border: 1px solid transparent;
      overflow: hidden;
      text-align: left;
    }
    .event-chip.proposal { background: var(--purple-100); color: var(--purple-900); border-color: var(--purple-200); }
    .event-chip.viva { background: var(--teal-100); color: var(--teal-900); border-color: var(--teal-200); }
    .event-chip-time { font-weight: 700; font-size: 10px; }
    .event-chip-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Agenda View */
    .agenda-wrap { display: flex; flex-direction: column; gap: 14px; }
    .agenda-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      box-shadow: var(--shadow-sm);
    }
    .agenda-date-box {
      width: 72px;
      min-width: 72px;
      background: var(--purple-50);
      border: 1px solid var(--purple-200);
      border-radius: var(--radius-sm);
      text-align: center;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .agenda-date-month { font-size: 11px; font-weight: 700; color: var(--purple-800); text-transform: uppercase; }
    .agenda-date-day { font-size: 20px; font-weight: 800; color: var(--purple-950); line-height: 1.1; }
    .agenda-date-time { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .agenda-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .agenda-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .agenda-candidate-name { font-size: 15px; font-weight: 700; color: var(--ink); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn .15s ease;
    }
    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--ink); }
    .modal-close-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; min-height: auto; box-shadow: none; }
    .modal-body { padding: 22px; }
    .modal-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      background: var(--soft);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .rating-pill-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .rating-pill {
      flex: 1;
      min-width: 130px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      transition: all .15s ease;
    }
    .rating-pill:hover { border-color: var(--purple-300); background: var(--purple-50); }
    .rating-pill.selected { border-color: var(--primary); background: var(--purple-100); color: var(--purple-950); font-weight: 700; }

    .copyright-bar {
      width: 100%;
      margin-top: auto;
      padding: 16px 20px;
      text-align: center;
      background: linear-gradient(115deg, #2e1065, #4c1d95 58%, #6d28d9);
      color: #ede9fe;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      box-shadow: 0 -4px 16px rgba(46,16,101,0.08);
    }

    @media (max-width: 860px) {
      .app-body { flex-direction: column; padding: 16px 12px 48px; }
      .portal-sidebar { width: 100%; min-width: 100%; position: static; }
      .calendar-grid { grid-template-columns: repeat(7, minmax(36px, 1fr)); }
      .calendar-day-cell { min-height: 80px; padding: 4px; }
      .event-chip-title { display: none; }
      .dossier-grid { grid-template-columns: 1fr; }
    }

    /* Chairperson Deliberation & Scale Selection Styles */
    .scale-row:hover {
      background-color: #f8fafc !important;
    }
    .scale-row.selected-scale {
      background-color: #f0fdf4 !important;
      border-color: #86efac !important;
    }
    .scale-radio-custom {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #15803d;
    }
    .period-card:hover {
      border-color: #9333ea !important;
      background: #faf5ff !important;
    }
    .period-card.selected-period {
      border-color: #6d28d9 !important;
      background: #f5f3ff !important;
      box-shadow: 0 0 0 1px #6d28d9;
    }

        <h3 style="margin:0 0 6px 0; font-size:16px; font-weight:700; color:#0f172a;">1. Download Candidate Review Materials</h3>
        <p style="margin:0 0 16px 0; font-size:13px; color:#64748b;">Review the candidate's thesis or proposal draft, and download the official prefilled evaluation form to complete your assessment.</p>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px;">

              <p style="margin:0 0 12px 0; font-size:12.5px; color:#64748b;">The official candidate submission deposited for this defence session.</p>
            </div>

        <p style="margin:0 0 16px 0; font-size:13px; color:#64748b;">Upload your finalized or signed evaluation report in PDF, DOC, or DOCX format (maximum 8 MB). The report will be submitted directly to the Postgraduate Secretariat.</p>

  <!-- =========================================================
       5. CLIENT-SIDE CONTROLLER & APP LOGIC
       ========================================================= -->
  <script>
    const state = {
      sessionToken: '',
      panel: null,
      isSupervisor: false,
      isExaminer: false,
      cases: [],
      calendarEvents: [],
      supervisees: [],
      supervisionLogs: [],
      progressReports: [],
      metrics: {},
      selectedCase: null,
      selectedFile: null,
      calendarDate: new Date(),
      calendarMode: 'grid',
      calendarFilter: 'all',
      modalCase: null,
      targetMeetingLog: null,
      targetProgressReport: null,
      selectedRating: 'Satisfactory'
    };
    try { state.sessionToken = sessionStorage.getItem('panel_session') || ''; } catch(e){}

    const $ = id => document.getElementById(id);

    function isStatusSubmitted(statusText, fileLink) {
      if (fileLink && /^https?:\/\//i.test(String(fileLink).trim())) return true;
      const s = String(statusText || '').trim().toLowerCase();
      if (!s) return false;
      if (s.indexOf('not') >= 0 || s.indexOf('pending') >= 0 || s.indexOf('awaiting') >= 0 || s.indexOf('unsubmitted') >= 0) {
        return false;
      }
      return s.indexOf('submitted') >= 0 || s.indexOf('received') >= 0 || s.indexOf('verified') >= 0;
    }

    function esc(val) {
      return String(val == null ? '' : val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDisplayTime(start, end) {
      function cleanOne(val) {
        if (!val) return '';
        const str = String(val).trim();
        if (!str) return '';
        const dateMatch = str.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
        if (/^[A-Za-z]{3}\s+[A-Za-z]{3}\s+\d+\s+1899/i.test(str) && dateMatch) {
          let h = parseInt(dateMatch[1], 10);
          const m = dateMatch[2];
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          return h + ':' + m + ' ' + ampm;
        }
        const timeMatch = str.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
        if (timeMatch) {
          let h = parseInt(timeMatch[1], 10);
          const m = timeMatch[2];
          const ampm = timeMatch[3];
          if (!ampm) {
            const suffix = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return h + ':' + m + ' ' + suffix;
          }
          return h + ':' + m + ' ' + ampm.toUpperCase();
        }
        return str;
      }

      const s = cleanOne(start);
      const e = cleanOne(end);
      if (s && e) return s + ' - ' + e + ' (MYT)';
      if (s) return s + ' (MYT)';
      return '';
    }

    function showStatus(elementId, message, type) {
      const el = $(elementId);
      if (!el) return;
      if (!message) {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      el.style.display = 'block';
      el.className = 'notice ' + (type || 'error');
      el.textContent = message;
    }

    function setBtnLoading(button, isLoading, loadingLabel) {
      if (!button) return;
      button.disabled = isLoading;
      if (isLoading) {
        button.dataset.label = button.dataset.label || button.innerHTML;
        button.innerHTML = '<span class="spinner"></span> <span>' + esc(loadingLabel || 'Loading...') + '</span>';
      } else {
        if (button.dataset.label) button.innerHTML = button.dataset.label;
      }
    }

    let extSelectedFile = null;

    function getServerDirectAccess_() {
      const el = $('serverDirectConfig');
      return {
        caseId: (el && el.getAttribute('data-case')) ? el.getAttribute('data-case').trim() : '',
        token: (el && el.getAttribute('data-token')) ? el.getAttribute('data-token').trim() : '',
        slot: (el && el.getAttribute('data-slot')) ? el.getAttribute('data-slot').trim() : ''
      };
    }

    function checkDirectAccessOnInit() {
      const serverCfg = getServerDirectAccess_();
      let caseId = serverCfg.caseId;
      let token = serverCfg.token;
      let slot = serverCfg.slot;

      if (!caseId || !token) {
        try {
          const sp = new URLSearchParams(window.location.search);
          caseId = sp.get('case') || sp.get('caseId') || caseId;
          token = sp.get('token') || token;
          slot = sp.get('slot') || slot;
        } catch(e) {}
      }

      if (caseId && token) {
        initExternalExaminerPortal(caseId, token, slot);
        return true;
      }
      return false;
    }

    function initExternalExaminerPortal(caseId, token, slot) {
      if ($('loginScreen')) $('loginScreen').style.display = 'none';
      if ($('appScreen')) $('appScreen').style.display = 'none';
      if ($('externalExaminerScreen')) $('externalExaminerScreen').style.display = 'block';
      showStatus('extNotice', 'Verifying external examiner credentials for Case ' + esc(caseId) + '...', 'loading');

      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || !response.ok) {
            showStatus('extNotice', (response && response.message) || 'Could not verify external examiner access link. Please request a fresh link from the Secretariat.', 'error');
            return;
          }
          showStatus('extNotice', '', '');
          state.externalContext = response;
          state.sessionToken = response.sessionToken;
          try { sessionStorage.setItem('panel_session', response.sessionToken); } catch(e){}
          renderExternalExaminerPortal(response);
        })
        .withFailureHandler(function(err) {
          showStatus('extNotice', (err && err.message) || String(err) || 'Failed to authenticate examination access link.', 'error');
        })
        .getDirectExaminerContext(caseId, token, slot);
    }

    function renderExternalExaminerPortal(ctx) {
      if ($('extExaminerBadge')) {
        $('extExaminerBadge').textContent = ctx.examinerName + ' · ' + (ctx.examinerRole || ctx.examinerSlot || 'Examiner');
      }
      if ($('extStudentName')) $('extStudentName').textContent = ctx.studentName;
      if ($('extStudentSub')) {
        $('extStudentSub').textContent = 'Case Ref: ' + ctx.caseId + ' · Candidate ID: ' + (ctx.studentKey || ctx.caseId) + ' · ' + (ctx.programme || 'Postgraduate Degree');
      }
      if ($('extDefenceTypeBadge')) {
        const isViva = (ctx.defenceType || '').toLowerCase().indexOf('viva') >= 0;
        $('extDefenceTypeBadge').className = 'dash-badge ' + (isViva ? 'viva' : 'proposal');
        $('extDefenceTypeBadge').textContent = ctx.defenceType || 'Defence Examination';
      }
      if ($('extResearchTitle')) $('extResearchTitle').textContent = ctx.researchTitle || 'No research title recorded.';
      if ($('extSessionDateTime')) {
        let dt = ctx.sessionDate || 'Date to be confirmed';
        if (ctx.startTime) dt += ' (' + ctx.startTime + (ctx.endTime ? ' - ' + ctx.endTime : '') + ')';
        $('extSessionDateTime').textContent = dt;
      }
      if ($('extVenueLocation')) {
        if (ctx.googleMeetLink) {
          $('extVenueLocation').innerHTML = '<a href="' + esc(ctx.googleMeetLink) + '" target="_blank" rel="noopener noreferrer" style="color:#6d4aff;text-decoration:underline;font-weight:700;">Online (Google Meet ↗)</a>';
        } else {
          $('extVenueLocation').textContent = ctx.venue || 'To be confirmed by Secretariat';
        }
      }
      if ($('extYourRole')) {
        $('extYourRole').textContent = (ctx.examinerRole || 'External Examiner') + ' (' + ctx.examinerSlot + ')';
      }

      // Draft Download Button
      const draftBtn = $('extDraftBtn');
      if (draftBtn) {
        if (ctx.studentDraftLink) {
          draftBtn.href = ctx.studentDraftLink;
          draftBtn.style.pointerEvents = 'auto';
          draftBtn.style.opacity = '1';
        } else {
          draftBtn.href = '#';
          draftBtn.style.pointerEvents = 'none';
          draftBtn.style.opacity = '0.5';
          draftBtn.innerHTML = '<span>Candidate Draft Not Yet Uploaded</span>';
        }
      }

      // Submission status
      updateExternalSubmissionStatus(ctx);
      setupExtDropzone();
    }

    function updateExternalSubmissionStatus(ctx) {
      const pill = $('extSubmissionStatusPill');
      const submittedCard = $('extSubmittedCard');
      const uploadArea = $('extUploadActiveArea');

      if (ctx.reportSubmitted) {
        if (pill) {
          pill.style.background = '#dcfce7';
          pill.style.color = '#15803d';
          pill.textContent = '✓ Report Submitted';
        }
        if (submittedCard) {
          submittedCard.style.display = 'block';
          if ($('extSubmittedMeta')) {
            $('extSubmittedMeta').textContent = 'Your official evaluation report was submitted to the examination repository' + (ctx.reportUpdatedAt ? ' on ' + ctx.reportUpdatedAt : '') + '.';
          }
          if ($('extViewSubmittedLink')) {
            if (ctx.reportFileUrl) {
              $('extViewSubmittedLink').href = ctx.reportFileUrl;
              $('extViewSubmittedLink').style.display = 'inline-flex';
            } else {
              $('extViewSubmittedLink').style.display = 'none';
            }
          }
        }
        if (uploadArea) uploadArea.style.display = 'none';
      } else {
        if (pill) {
          pill.style.background = '#fef3c7';
          pill.style.color = '#92400e';
          pill.textContent = 'Awaiting Evaluation Report';
        }
        if (submittedCard) submittedCard.style.display = 'none';
        if (uploadArea) uploadArea.style.display = 'block';
      }
    }

    function extToggleReupload() {
      const uploadArea = $('extUploadActiveArea');
      if (uploadArea) {
        uploadArea.style.display = uploadArea.style.display === 'none' ? 'block' : 'none';
        if (uploadArea.style.display === 'block') {
          uploadArea.scrollIntoView({ behavior: 'smooth' });
        }
      }
    }

    function handleExtDownloadWordTemplate() {
      if (!state.externalContext) return;
      const btn = $('extDownloadWordBtn');
      setBtnLoading(btn, true, 'Generating Word Document...');
      showStatus('extDownloadStatus', 'Generating prefilled official Word report form (.docx)...', 'loading');

      google.script.run
        .withSuccessHandler(function(result) {
          setBtnLoading(btn, false);
          try {
            const binary = atob(result.base64Data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: result.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = result.fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showStatus('extDownloadStatus', 'Prefilled Word report form downloaded successfully. Complete your assessment and upload it below.', 'success');
          } catch(e) {
            showStatus('extDownloadStatus', 'Error handling downloaded template: ' + e.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          setBtnLoading(btn, false);
          showStatus('extDownloadStatus', (err && err.message) || String(err) || 'Failed to download report template.', 'error');
        })
        .getExaminerReportTemplate(state.externalContext.examinerName, state.externalContext.caseId, state.sessionToken);
    }

    function setupExtDropzone() {
      const dropzone = $('extDropZone');
      if (!dropzone || dropzone.dataset.initialized) return;
      dropzone.dataset.initialized = 'true';

      ['dragenter', 'dragover'].forEach(ev => {
        dropzone.addEventListener(ev, e => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(ev => {
        dropzone.addEventListener(ev, e => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });

      dropzone.addEventListener('drop', e => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          handleExtFileSelected(e.dataTransfer.files[0]);
        }
      });
    }

    function handleExtFileSelected(file) {
      if (!file) return;
      const maxBytes = 8 * 1024 * 1024;
      const allowed = ['pdf', 'doc', 'docx'];
      const ext = file.name.split('.').pop().toLowerCase();

      if (!allowed.includes(ext)) {
        showStatus('extUploadNotice', 'Only PDF, DOC, and DOCX documents are accepted.', 'error');
        return;
      }
      if (file.size > maxBytes) {
        showStatus('extUploadNotice', 'Selected file (' + (file.size / 1024 / 1024).toFixed(1) + ' MB) exceeds the 8 MB limit.', 'error');
        return;
      }

      showStatus('extUploadNotice', '', '');
      extSelectedFile = file;
      if ($('extSelectedFileName')) $('extSelectedFileName').textContent = file.name + ' (' + formatFileSize(file.size) + ')';
      if ($('extSelectedFileWrap')) $('extSelectedFileWrap').style.display = 'block';
      if ($('extSubmitBtn')) $('extSubmitBtn').disabled = false;
    }

    function clearExtSelectedFile() {
      extSelectedFile = null;
      if ($('extFileInput')) $('extFileInput').value = '';
      if ($('extSelectedFileWrap')) $('extSelectedFileWrap').style.display = 'none';
      if ($('extSubmitBtn')) $('extSubmitBtn').disabled = true;
    }

    function handleExtSubmitReport() {
      if (!extSelectedFile || !state.externalContext) return;
      const btn = $('extSubmitBtn');
      setBtnLoading(btn, true, 'Submitting evaluation report...');
      showStatus('extUploadNotice', 'Reading and depositing evaluation report into candidate repository...', 'loading');

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        const payload = {
          panelName: state.externalContext.examinerName,
          caseId: state.externalContext.caseId,
          fileName: extSelectedFile.name,
          mimeType: extSelectedFile.type || 'application/pdf',
          base64Data: base64Data,
          sessionToken: state.sessionToken
        };

        google.script.run
          .withSuccessHandler(function(res) {
            setBtnLoading(btn, false);
            clearExtSelectedFile();
            showStatus('extUploadNotice', 'Evaluation report submitted successfully! A copy has been filed with the Examination Secretariat.', 'success');
            state.externalContext.reportSubmitted = true;
            state.externalContext.reportStatus = 'Submitted';
            state.externalContext.reportFileUrl = res && res.fileUrl;
            state.externalContext.reportUpdatedAt = 'Just now';
            updateExternalSubmissionStatus(state.externalContext);
          })
          .withFailureHandler(function(err) {
            setBtnLoading(btn, false);
            showStatus('extUploadNotice', (err && err.message) || String(err) || 'Failed to submit report. Please try again.', 'error');
          })
          .uploadExaminerReport(payload);
      };
      reader.onerror = function() {
        setBtnLoading(btn, false);
        showStatus('extUploadNotice', 'Failed to read file from your device.', 'error');
      };
      reader.readAsDataURL(extSelectedFile);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (checkDirectAccessOnInit()) return;
      setupAutocomplete();
      checkSavedSession();
      setupDropzone();
    });

    function checkSavedSession() {
      try {
        const savedName = sessionStorage.getItem('panel_auth_name');
        const savedEmail = sessionStorage.getItem('panel_auth_email');
        if (savedName && savedEmail) {
          $('lookupPanelName').value = savedName;
          $('lookupPanelEmail').value = savedEmail;
          executeLogin(savedName, savedEmail, true);
        }
      } catch (e) {}
    }

    let suggestDebounce = null;
    function setupAutocomplete() {
      const input = $('lookupPanelName');
      const list = $('nameSuggestions');

      input.addEventListener('input', () => {
        clearTimeout(suggestDebounce);
        const query = input.value.trim();
        if (query.length < 2) {
          list.style.display = 'none';
          list.innerHTML = '';
          return;
        }

        suggestDebounce = setTimeout(() => {
          google.script.run
            .withSuccessHandler(suggestions => {
              if (!suggestions || !suggestions.length) {
                list.style.display = 'none';
                list.innerHTML = '';
                return;
              }
              list.innerHTML = suggestions.map(name => 
                '<li class="suggestion-item" onclick="selectSuggestion(\'' + esc(name).replace(/'/g, "\\'") + '\')">' + esc(name) + '</li>'
              ).join('');
              list.style.display = 'block';
            })
            .withFailureHandler(() => { list.style.display = 'none'; })
            .getPanelNameSuggestions(query);
        }, 220);
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !list.contains(e.target)) {
          list.style.display = 'none';
        }
      });
    }

    function selectSuggestion(name) {
      $('lookupPanelName').value = name;
      $('nameSuggestions').style.display = 'none';
      $('lookupPanelEmail').focus();
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const name = $('lookupPanelName').value.trim();
      const email = $('lookupPanelEmail').value.trim();
      if (!name || !email) {
        showStatus('loginStatus', 'Please enter your registered academic name and email address.', 'error');
        return;
      }
      executeLogin(name, email, false);
    }

    function executeLogin(name, email, isAuto) {
      const btn = $('loginSubmitBtn');
      setBtnLoading(btn, true, isAuto ? 'Restoring session...' : 'Verifying credentials...');
      showStatus('loginStatus', isAuto ? 'Restoring active faculty session...' : 'Validating directory credentials...', 'loading');

      google.script.run
        .withSuccessHandler(response => {
          setBtnLoading(btn, false);
          if(response&&response.challengeId){showFacultyCodeForm(response.challengeId,name,email);return;}
          if (!response || !response.ok) {
            showStatus('loginStatus', (response && response.message) || 'Credentials could not be verified.', 'error');
            try { sessionStorage.removeItem('panel_auth_name'); sessionStorage.removeItem('panel_auth_email'); } catch(e){}
            return;
          }

          try {
            sessionStorage.setItem('panel_auth_name', response.panel.name);
            sessionStorage.setItem('panel_auth_email', email);
          } catch(e){}

          if (response.sessionToken) {
            state.sessionToken = response.sessionToken;
            try { sessionStorage.setItem('panel_session', response.sessionToken); } catch(e){}
          }

          state.panel = response.panel;
          state.isSupervisor = !!response.isSupervisor;
          state.isExaminer = !!response.isExaminer;
          state.cases = response.cases || [];
          state.calendarEvents = response.calendarEvents || [];
          state.supervisees = response.supervisees || [];
          state.supervisionLogs = response.supervisionLogs || [];
          state.progressReports = response.progressReports || [];
          state.metrics = response.metrics || {};

          try {
            renderFacultyProfile();
            renderDashboard();
            populateSuperviseeViews();
            populateCaseSelector();
            renderCalendar();
          } catch(renderErr) {
            console.error('Render error during login:', renderErr);
          }

          if ($('loginScreen')) $('loginScreen').style.display = 'none';
          if ($('appScreen')) $('appScreen').style.display = 'flex';
          switchPortalView('dashboard');
        })
        .withFailureHandler(error => {
          setBtnLoading(btn, false);
          state.sessionToken = '';
          try { sessionStorage.removeItem('panel_session'); } catch(e){}
          const msg = (error && error.message) || String(error) || 'Failed to authenticate.';
          showStatus('loginStatus', msg, 'error');
        })
        .getPanelContextByCredentials(name, email, state.sessionToken);
    }

    function handleSignOut() {
      if(state.sessionToken)google.script.run.revokeFacultySession(state.sessionToken);
      state.sessionToken="";try{sessionStorage.removeItem("panel_session");}catch(e){}
      try {
        sessionStorage.removeItem('panel_auth_name');
        sessionStorage.removeItem('panel_auth_email');
      } catch(e){}
      state.panel = null;
      state.cases = [];
      state.calendarEvents = [];
      state.supervisees = [];
      state.supervisionLogs = [];
      state.progressReports = [];
      state.selectedCase = null;
      state.selectedFile = null;

      $('appScreen').style.display = 'none';
      $('loginScreen').style.display = 'flex';
      $('lookupPanelName').value = '';
      $('lookupPanelEmail').value = '';
      showStatus('loginStatus', '', '');
    }

    function handleSessionExpiry(error, fallbackStatusId) {
      const msg = (error && error.message) || String(error) || '';
      const isExpired = msg.toLowerCase().indexOf('session expired') >= 0
        || msg.toLowerCase().indexOf('sign in again') >= 0
        || msg.toLowerCase().indexOf('faculty session') >= 0;
      if (isExpired) {
        state.sessionToken = '';
        try { sessionStorage.removeItem('panel_session'); } catch(e) {}

        const savedName = sessionStorage.getItem('panel_auth_name') || (state.panel && state.panel.name);
        const savedEmail = sessionStorage.getItem('panel_auth_email') || (state.panel && (state.panel.primaryEmail || state.panel.alternateEmail));
        if (savedName && savedEmail) {
          google.script.run
            .withSuccessHandler(r => {
              if (r && r.sessionToken) {
                state.sessionToken = r.sessionToken;
                try { sessionStorage.setItem('panel_session', r.sessionToken); } catch(e){}
                if (fallbackStatusId) showStatus(fallbackStatusId, 'Session refreshed. Please click Download again.', 'info');
              }
            })
            .withFailureHandler(() => {
              forceSignOutForExpiry();
            })
            .getPanelContextByCredentials(savedName, savedEmail, '');
          return true;
        }

        forceSignOutForExpiry();
        return true;
      }
      return false;
    }

    function forceSignOutForExpiry() {
      state.sessionToken = '';
      try { sessionStorage.removeItem('panel_session'); } catch(e) {}
      state.panel = null;
      state.cases = [];
      state.calendarEvents = [];
      state.supervisees = [];
      state.supervisionLogs = [];
      state.progressReports = [];
      state.selectedCase = null;
      state.selectedFile = null;
      if ($('appScreen')) $('appScreen').style.display = 'none';
      if ($('loginScreen')) $('loginScreen').style.display = 'flex';
      showStatus('loginStatus', 'Your session expired. Please sign in again to continue.', 'error');
    }


    function renderFacultyProfile() {
      if (!state.panel) return;
      const panel = state.panel;
      const initials = panel.name.split(' ').filter(p => p).map(p => p[0]).slice(0, 2).join('').toUpperCase();
      if ($('sidebarAvatar')) $('sidebarAvatar').textContent = initials || 'AC';
      if ($('sidebarPanelName')) $('sidebarPanelName').textContent = panel.name;
      if ($('sidebarPanelEmail')) $('sidebarPanelEmail').textContent = panel.primaryEmail;

      let roleLabel = 'Academic Faculty';
      if (state.isSupervisor && state.isExaminer) roleLabel = 'Supervisor & Examiner';
      else if (state.isSupervisor) roleLabel = 'Academic Supervisor';
      else if (state.isExaminer) roleLabel = 'Panel Examiner';

      if ($('sidebarPanelRoleBadge')) $('sidebarPanelRoleBadge').textContent = roleLabel;
      if ($('headerRoleBadge')) $('headerRoleBadge').textContent = roleLabel;

      // Sidebar counters
      if (state.isSupervisor) {
        if ($('sidebarSuperviseesRow')) $('sidebarSuperviseesRow').style.display = 'flex';
        if ($('sidebarSuperviseesCount')) $('sidebarSuperviseesCount').textContent = state.supervisees.length;
        if ($('navSupervisorSection')) $('navSupervisorSection').style.display = 'block';
      } else {
        if ($('sidebarSuperviseesRow')) $('sidebarSuperviseesRow').style.display = 'none';
        if ($('navSupervisorSection')) $('navSupervisorSection').style.display = 'none';
      }

      if (state.isExaminer) {
        if ($('sidebarAssignedRow')) $('sidebarAssignedRow').style.display = 'flex';
        if ($('sidebarAssignedCount')) $('sidebarAssignedCount').textContent = state.cases.length;
        if ($('navExaminerSection')) $('navExaminerSection').style.display = 'block';
        if ($('dashQuickCalBtn')) $('dashQuickCalBtn').style.display = 'inline-flex';
      } else {
        if ($('sidebarAssignedRow')) $('sidebarAssignedRow').style.display = 'none';
        if ($('navExaminerSection')) $('navExaminerSection').style.display = 'none';
        if ($('dashQuickCalBtn')) $('dashQuickCalBtn').style.display = 'none';
      }

      if ($('dashGreeting')) $('dashGreeting').textContent = 'Welcome back, ' + panel.name;
    }

    function switchPortalView(viewName) {
      const views = ['dashboard', 'supervisees', 'meetings', 'progress', 'submission', 'calendar'];
      views.forEach(v => {
        const btn = $('nav' + capitalize(v));
        const view = $('view' + capitalize(v));
        if (btn) btn.classList.toggle('active', v === viewName);
        if (view) view.classList.toggle('active', v === viewName);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // VIEW 1: DASHBOARD

        feed.innerHTML = '<div style="color: var(--muted); font-size: 13px; font-style: italic; padding: 12px 0;">No consultation logs recorded yet.</div>';
        return;
      }

      feed.innerHTML = recentLogs.map(log => {
        const isVerified = (log.endorsementStatus || '').toLowerCase().indexOf('verified') >= 0;
        const badge = isVerified 
          ? '<span class="dash-badge verified">Verified</span>'
          : '<span class="dash-badge pending">Pending Verification</span>';
        
        const actionBtn = !isVerified
          ? '<button type="button" class="secondary" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px;" onclick="openEndorseMeetingModal(\'' + esc(log.logId).replace(/'/g, "\\'") + '\')">Verify</button>'

            '<div>' +

              '<div class="dash-item-sub">' + esc(log.meetingDate) + ' · ' + esc(log.meetingMode) + '</div>' +

      if (!upcoming.length) {
        container.innerHTML = '<div style="color: var(--muted); font-size: 13px; font-style: italic; padding: 12px 0;">No upcoming examinations scheduled.</div>';
        return;
      }

      container.innerHTML = upcoming.map(ev => {
        const typeBadge = ev.type === 'viva' 
          ? '<span class="dash-badge viva">Viva Voce</span>'
          : '<span class="dash-badge proposal">Proposal Defence</span>';

          submitBtnHtml = '<button type="button" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px; background: #6b21a8; color: #fff;" onclick="selectCaseAndGoSubmission(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Review Reports</button>';
        } else {
          const isSubmitted = Boolean(ev.reportSubmitted || isStatusSubmitted(ev.reportStatus, ev.reportFileUrl));
          submitBtnHtml = isSubmitted
            ? '<button type="button" class="secondary" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px; opacity:0.8;" disabled title="Report already submitted">✓ Report Submitted</button>'
            : '<button type="button" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px;" onclick="selectCaseAndGoSubmission(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Submit Report</button>';
        }

        return '<div class="dash-item-card">' +
          '<div class="dash-item-head">' +
            '<div>' +
              '<div class="dash-item-title">' + esc(ev.studentName) + '</div>' +
              '<div class="dash-item-sub">' + esc(ev.date) + (ev.startTime ? ' (' + esc(formatDisplayTime(ev.startTime, ev.endTime)) + ')' : '') + ' · ' + esc(ev.slot) + '</div>' +
            '</div>' +
            typeBadge +
          '</div>' +
          '<div class="dash-item-actions">' +
            '<button type="button" class="secondary" style="min-height: 28px; padding: 2px 10px; font-size: 11.5px;" onclick="openSessionModal(\'' + esc(ev.caseId).replace(/'/g, "\\'") + '\')">Dossier</button>' +

    // =========================================================
    // VIEW 2: MY SUPERVISEES
    // =========================================================

            '<span class="dash-badge proposal">' + esc(s.stage || 'Candidature') + '</span>' +
          '</div>' +
          '<div class="supervisee-title-box">' +
            '<strong>Research:</strong> ' + esc(s.researchTitle || 'Research Title in Progress') +
